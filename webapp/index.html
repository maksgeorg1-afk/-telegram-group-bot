<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>UA Games</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b14;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
}

#app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    position: relative;
    overflow: hidden;
    margin: auto;
}

.screen {
    width: 100%;
    height: 100%;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.screen.active {
    display: flex;
}

.title {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    margin-top: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #8f98aa;
    font-size: 15px;
    margin-bottom: 25px;
}

.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 20px;
}

.game-card {
    border: none;
    border-radius: 24px;
    min-height: 150px;
    color: white;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(
        145deg,
        #151b2d,
        #0e1320
    );
    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06);
}

.game-card:active {
    transform: scale(.96);
}

.game-icon {
    display: block;
    font-size: 55px;
    margin-bottom: 12px;
}

.back {
    margin-top: auto;
    border: none;
    border-radius: 18px;
    min-height: 54px;
    color: white;
    background: #151b2d;
    font-size: 16px;
    font-weight: 700;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.header button {
    border: none;
    background: #151b2d;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 14px;
    font-size: 20px;
}

.game-name {
    font-size: 24px;
    font-weight: 900;
}

.score {
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 10px;
}

/* ВАЖНО: поле полностью забирает касания себе */

#snakeCanvas,
#tetrisCanvas {
    display: block;
    margin: auto;

    background: #0b0f1a;

    border-radius: 22px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.05);

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    overscroll-behavior: none;
}

.tip {
    text-align: center;
    color: #7f8899;
    font-size: 13px;
    margin-top: 12px;
}

.bottom-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.bottom-buttons button {
    flex: 1;
    min-height: 52px;
    border: none;
    border-radius: 17px;
    color: white;
    background: #151b2d;
    font-size: 15px;
    font-weight: 800;
}

.bottom-buttons button:active {
    transform: scale(.97);
}

.overlay {
    position: absolute;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: rgba(0,0,0,.7);

    backdrop-filter: blur(8px);

    z-index: 20;

    touch-action: none;
}

.overlay.active {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 350px;

    padding: 30px;

    border-radius: 28px;

    text-align: center;

    background: #111726;

    box-shadow:
        0 25px 70px rgba(0,0,0,.6);
}

.modal-title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 10px;
}

.modal-score {
    font-size: 20px;
    margin: 15px 0 25px;
    color: #b6bfd0;
}

.modal button {
    width: 100%;
    min-height: 55px;

    border: none;
    border-radius: 17px;

    color: white;
    background: #247cff;

    font-size: 17px;
    font-weight: 900;

    margin-top: 10px;
}

</style>

</head>

<body>

<div id="app">


<!-- ================================
     МЕНЮ
================================ -->

<div id="menu" class="screen active">

    <div class="title">
        🎮 ИГРОВОЙ ЦЕНТР
    </div>

    <div class="subtitle">
        Выбирай игру и устанавливай рекорды 🏆
    </div>

    <div class="menu-grid">

        <button
            class="game-card"
            onclick="openSnake()"
        >
            <span class="game-icon">🐍</span>
            ЗМЕЙКА
        </button>

        <button
            class="game-card"
            onclick="openTetris()"
        >
            <span class="game-icon">🧱</span>
            ТЕТРИС
        </button>

    </div>

    <button
        class="back"
        onclick="closeApp()"
    >
        ✕ Закрыть
    </button>

</div>


<!-- ================================
     ЗМЕЙКА
================================ -->

<div id="snakeScreen" class="screen">

    <div class="header">

        <button onclick="backToMenu()">
            ←
        </button>

        <div class="game-name">
            🐍 ЗМЕЙКА
        </div>

        <button onclick="restartSnake()">
            🔄
        </button>

    </div>

    <div
        id="snakeScore"
        class="score"
    >
        🏆 0
    </div>

    <canvas
        id="snakeCanvas"
    ></canvas>

    <div class="tip">
        👆 Свайпай пальцем по полю
    </div>

    <div class="bottom-buttons">

        <button onclick="pauseSnake()">
            ⏸ Пауза
        </button>

        <button onclick="restartSnake()">
            🔄 Новая игра
        </button>

    </div>

</div>


<!-- ================================
     ТЕТРИС
================================ -->

<div id="tetrisScreen" class="screen">

    <div class="header">

        <button onclick="backToMenu()">
            ←
        </button>

        <div class="game-name">
            🧱 ТЕТРИС
        </div>

        <button onclick="restartTetris()">
            🔄
        </button>

    </div>

    <div
        id="tetrisScore"
        class="score"
    >
        🏆 0
    </div>

    <canvas
        id="tetrisCanvas"
    ></canvas>

    <div class="tip">
        👈 👉 свайп — движение · 👆 тап — поворот
    </div>

    <div class="bottom-buttons">

        <button onclick="softDrop()">
            ⬇️ Быстрее
        </button>

        <button onclick="hardDrop()">
            ⏬ Сброс
        </button>

    </div>

</div>


<!-- ================================
     GAME OVER
================================ -->

<div id="gameOver" class="overlay">

    <div class="modal">

        <div
            id="gameOverTitle"
            class="modal-title"
        >
            💥 ИГРА ОКОНЧЕНА
        </div>

        <div
            id="gameOverScore"
            class="modal-score"
        >
            Очки: 0
        </div>

        <button onclick="restartCurrentGame()">
            🔄 Играть снова
        </button>

        <button
            onclick="closeGameOver()"
            style="background:#20283b"
        >
            🎮 Выбрать игру
        </button>

    </div>

</div>

</div>


<script>

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

    /*
       ГЛАВНОЕ ИСПРАВЛЕНИЕ:

       Telegram Mini App не будет закрываться
       при свайпе пальцем вниз.
    */

    try {

        if (
            typeof tg.disableVerticalSwipes ===
            "function"
        ) {
            tg.disableVerticalSwipes();
        }

    } catch(e) {}

    try {

        tg.setHeaderColor("#080b14");

        tg.setBackgroundColor("#080b14");

    } catch(e) {}

}


/* =========================================
   ОБЩЕЕ
========================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });

    document
        .getElementById(id)
        .classList.add("active");
}


function closeApp() {

    if (tg) {

        try {
            tg.close();
        } catch(e) {}

    }

}


function backToMenu() {

    snakeRunning = false;

    tetrisRunning = false;

    clearTimeout(snakeTimer);
    clearTimeout(tetrisTimer);

    document
        .getElementById("gameOver")
        .classList.remove("active");

    showScreen("menu");
}


let currentGame = "";


/* =========================================
   ЗМЕЙКА
========================================= */

const snakeCanvas =
    document.getElementById(
        "snakeCanvas"
    );

const snakeCtx =
    snakeCanvas.getContext("2d");


const SW = 16;
const SH = 20;


let snake = [];

let food = null;


let snakeDirection = {
    x: 1,
    y: 0
};


let snakeNextDirection = {
    x: 1,
    y: 0
};


let snakeScore = 0;

let snakeRunning = false;

let snakePaused = false;

let snakeTimer = null;


/*
   Эти переменные используются
   для управления пальцем.
*/

let snakeTouchStartX = 0;
let snakeTouchStartY = 0;

let snakeTouchActive = false;


/* =========================================
   РАЗМЕР ПОЛЯ
========================================= */

function setupSnakeCanvas() {

    const size =
        Math.min(
            window.innerWidth - 40,
            390
        );

    snakeCanvas.width = size;

    snakeCanvas.height =
        Math.floor(
            size * SH / SW
        );
}


/* =========================================
   ОТКРЫТИЕ
========================================= */

function openSnake() {

    currentGame = "snake";

    showScreen("snakeScreen");

    setupSnakeCanvas();

    restartSnake();
}


/* =========================================
   НОВАЯ ИГРА
========================================= */

function restartSnake() {

    clearTimeout(snakeTimer);

    snake = [

        {
            x: 7,
            y: 10
        },

        {
            x: 6,
            y: 10
        },

        {
            x: 5,
            y: 10
        }

    ];


    snakeDirection = {
        x: 1,
        y: 0
    };


    snakeNextDirection = {
        x: 1,
        y: 0
    };


    snakeScore = 0;

    snakePaused = false;

    snakeRunning = true;


    const pauseButton =
        document.querySelector(
            "#snakeScreen .bottom-buttons button"
        );

    if (pauseButton) {

        pauseButton.textContent =
            "⏸ Пауза";

    }


    createFood();

    updateSnakeScore();

    drawSnake();

    snakeLoop();
}


/* =========================================
   ЕДА
========================================= */

function createFood() {

    let valid = false;

    while (!valid) {

        food = {

            x:
                Math.floor(
                    Math.random() * SW
                ),

            y:
                Math.floor(
                    Math.random() * SH
                )

        };


        valid =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );
    }
}


/* =========================================
   СЧЁТ
========================================= */

function updateSnakeScore() {

    document
        .getElementById(
            "snakeScore"
        )
        .textContent =
        "🏆 " + snakeScore;
}


/* =========================================
   РИСОВАНИЕ
========================================= */

function drawSnake() {

    const cellW =
        snakeCanvas.width / SW;

    const cellH =
        snakeCanvas.height / SH;


    snakeCtx.clearRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );


    snakeCtx.fillStyle =
        "#0b0f1a";


    snakeCtx.fillRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );


    /* сетка */

    snakeCtx.strokeStyle =
        "rgba(255,255,255,.025)";

    snakeCtx.lineWidth = 1;


    for (
        let x = 0;
        x <= SW;
        x++
    ) {

        snakeCtx.beginPath();

        snakeCtx.moveTo(
            x * cellW,
            0
        );

        snakeCtx.lineTo(
            x * cellW,
            snakeCanvas.height
        );

        snakeCtx.stroke();

    }


    for (
        let y = 0;
        y <= SH;
        y++
    ) {

        snakeCtx.beginPath();

        snakeCtx.moveTo(
            0,
            y * cellH
        );

        snakeCtx.lineTo(
            snakeCanvas.width,
            y * cellH
        );

        snakeCtx.stroke();

    }


    /* яблоко */

    if (food) {

        snakeCtx.font =
            `${Math.floor(
                cellH * .9
            )}px serif`;

        snakeCtx.textAlign =
            "center";

        snakeCtx.textBaseline =
            "middle";


        snakeCtx.fillText(
            "🍎",

            food.x * cellW +
                cellW / 2,

            food.y * cellH +
                cellH / 2
        );
    }


    /* тело */

    snake.forEach(
        (part, index) => {

            const padding = 2;


            const x =
                part.x * cellW +
                padding;


            const y =
                part.y * cellH +
                padding;


            const w =
                cellW -
                padding * 2;


            const h =
                cellH -
                padding * 2;


            snakeCtx.fillStyle =
                index === 0
                    ? "#65ff7a"
                    : "#20c957";


            snakeCtx.beginPath();


            snakeCtx.roundRect(
                x,
                y,
                w,
                h,
                Math.min(
                    6,
                    w / 3
                )
            );


            snakeCtx.fill();


            /* глаза */

            if (index === 0) {

                snakeCtx.fillStyle =
                    "#07100a";


                const eyeSize =
                    Math.max(
                        2,
                        cellW * .11
                    );


                let ex;
                let ey1;
                let ey2;


                if (
                    snakeDirection.x > 0
                ) {

                    ex =
                        x + w * .68;

                    ey1 =
                        y + h * .32;

                    ey2 =
                        y + h * .68;

                }

                else if (
                    snakeDirection.x < 0
                ) {

                    ex =
                        x + w * .32;

                    ey1 =
                        y + h * .32;

                    ey2 =
                        y + h * .68;

                }

                else if (
                    snakeDirection.y < 0
                ) {

                    ex1 =
                        x + w * .32;

                    ex2 =
                        x + w * .68;

                    ey =
                        y + h * .32;


                    snakeCtx.beginPath();

                    snakeCtx.arc(
                        ex1,
                        ey,
                        eyeSize,
                        0,
                        Math.PI * 2
                    );

                    snakeCtx.fill();


                    snakeCtx.beginPath();

                    snakeCtx.arc(
                        ex2,
                        ey,
                        eyeSize,
                        0,
                        Math.PI * 2
                    );

                    snakeCtx.fill();

                    return;

                }

                else {

                    ex1 =
                        x + w * .32;

                    ex2 =
                        x + w * .68;

                    ey =
                        y + h * .68;


                    snakeCtx.beginPath();

                    snakeCtx.arc(
                        ex1,
                        ey,
                        eyeSize,
                        0,
                        Math.PI * 2
                    );

                    snakeCtx.fill();


                    snakeCtx.beginPath();

                    snakeCtx.arc(
                        ex2,
                        ey,
                        eyeSize,
                        0,
                        Math.PI * 2
                    );

                    snakeCtx.fill();

                    return;
                }


                snakeCtx.beginPath();

                snakeCtx.arc(
                    ex,
                    ey1,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                snakeCtx.fill();


                snakeCtx.beginPath();

                snakeCtx.arc(
                    ex,
                    ey2,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                snakeCtx.fill();

            }

        }
    );
}


/* =========================================
   ИГРОВОЙ ЦИКЛ
========================================= */

function snakeLoop() {

    if (!snakeRunning) {
        return;
    }


    snakeTimer =
        setTimeout(
            () => {

                if (!snakePaused) {

                    /*
                       Используем именно
                       следующую команду.
                    */

                    snakeDirection = {
                        x:
                            snakeNextDirection.x,

                        y:
                            snakeNextDirection.y
                    };


                    const head =
                        snake[0];


                    const newHead = {

                        x:
                            head.x +
                            snakeDirection.x,

                        y:
                            head.y +
                            snakeDirection.y

                    };


                    /* стена */

                    if (

                        newHead.x < 0 ||

                        newHead.x >= SW ||

                        newHead.y < 0 ||

                        newHead.y >= SH

                    ) {

                        snakeGameOver();

                        return;
                    }


                    const eating =
                        food &&

                        newHead.x ===
                            food.x &&

                        newHead.y ===
                            food.y;


                    /*
                       Если не едим,
                       хвост уйдёт,
                       поэтому последнюю клетку
                       не проверяем.
                    */

                    const bodyToCheck =
                        eating
                            ? snake
                            : snake.slice(
                                0,
                                snake.length - 1
                            );


                    /* столкновение */

                    if (

                        bodyToCheck.some(
                            part =>

                                part.x ===
                                    newHead.x &&

                                part.y ===
                                    newHead.y
                        )

                    ) {

                        snakeGameOver();

                        return;
                    }


                    snake.unshift(
                        newHead
                    );


                    if (eating) {

                        snakeScore += 10;

                        updateSnakeScore();

                        createFood();

                        haptic();

                    }

                    else {

                        snake.pop();

                    }


                    drawSnake();

                }


                snakeLoop();

            },

            /*
               Сначала игра медленная,
               потом постепенно ускоряется.
            */

            Math.max(
                75,
                135 -
                Math.min(
                    60,
                    snakeScore * .4
                )
            )
        );
}


/* =========================================
   GAME OVER
========================================= */

function snakeGameOver() {

    snakeRunning = false;

    clearTimeout(snakeTimer);

    showGameOver(
        "🐍 ЗМЕЙКА ОКОНЧЕНА",
        snakeScore
    );
}


/* =========================================
   ПАУЗА
========================================= */

function pauseSnake() {

    if (!snakeRunning) {
        return;
    }


    snakePaused =
        !snakePaused;


    const button =
        document.querySelector(
            "#snakeScreen .bottom-buttons button"
        );


    if (button) {

        button.textContent =
            snakePaused
                ? "▶️ Продолжить"
                : "⏸ Пауза";

    }
}


/* =========================================
   СВАЙП ЗМЕЙКИ
========================================= */

/*
   ВАЖНО:

   touch-action:none
   + preventDefault()
   не дают Telegram
   воспринимать свайп
   как свайп закрытия Mini App.
*/

snakeCanvas.addEventListener(
    "touchstart",
    function(e) {

        if (!snakeRunning) {
            return;
        }


        e.preventDefault();


        const touch =
            e.changedTouches[0];


        snakeTouchStartX =
            touch.clientX;


        snakeTouchStartY =
            touch.clientY;


        snakeTouchActive = true;

    },
    {
        passive: false
    }
);


snakeCanvas.addEventListener(
    "touchmove",
    function(e) {

        /*
           Полностью блокируем
           прокрутку/свайп страницы.
        */

        e.preventDefault();

    },
    {
        passive: false
    }
);


snakeCanvas.addEventListener(
    "touchend",
    function(e) {

        if (!snakeTouchActive) {
            return;
        }


        e.preventDefault();


        snakeTouchActive = false;


        const touch =
            e.changedTouches[0];


        const dx =
            touch.clientX -
            snakeTouchStartX;


        const dy =
            touch.clientY -
            snakeTouchStartY;


        /*
           Небольшой порог,
           чтобы управление
           ощущалось отзывчивым.
        */

        const minSwipe = 12;


        if (

            Math.abs(dx) < minSwipe &&

            Math.abs(dy) < minSwipe

        ) {

            return;
        }


        /*
           Определяем направление
           по самой длинной оси.
        */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                changeSnakeDirection(
                    1,
                    0
                );

            }

            else {

                changeSnakeDirection(
                    -1,
                    0
                );

            }

        }

        else {

            if (dy > 0) {

                changeSnakeDirection(
                    0,
                    1
                );

            }

            else {

                changeSnakeDirection(
                    0,
                    -1
                );

            }

        }

    },
    {
        passive: false
    }
);


/*
   На некоторых iPhone touchend
   может не сработать как ожидается,
   поэтому добавляем touchcancel.
*/

snakeCanvas.addEventListener(
    "touchcancel",
    function(e) {

        snakeTouchActive = false;

    },
    {
        passive: false
    }
);


/* =========================================
   СМЕНА НАПРАВЛЕНИЯ
========================================= */

function changeSnakeDirection(
    x,
    y
) {

    if (!snakeRunning) {
        return;
    }


    /*
       Нельзя сразу повернуть
       в противоположную сторону.

       Например:
       → нельзя сразу ←
    */

    if (

        x === -snakeDirection.x &&

        y === -snakeDirection.y

    ) {

        return;
    }


    /*
       Также не даём отправить
       одинаковую команду.
    */

    if (

        x === snakeNextDirection.x &&

        y === snakeNextDirection.y

    ) {

        return;
    }


    snakeNextDirection = {
        x: x,
        y: y
    };


    haptic();

}


/* =========================================
   ТЕТРИС
========================================= */

const tetrisCanvas =
    document.getElementById(
        "tetrisCanvas"
    );

const tetrisCtx =
    tetrisCanvas.getContext("2d");


const TW = 10;
const TH = 18;


let tetrisBoard = [];

let currentPiece = null;

let tetrisScore = 0;

let tetrisRunning = false;

let tetrisTimer = null;


let tetrisTouchStartX = 0;

let tetrisTouchStartY = 0;


/* =========================================
   ФИГУРЫ
========================================= */

const pieces = [

    {
        shape: [
            [1,1,1,1]
        ],
        emoji: "🟥"
    },

    {
        shape: [
            [1,1],
            [1,1]
        ],
        emoji: "🟨"
    },

    {
        shape: [
            [0,1,0],
            [1,1,1]
        ],
        emoji: "🟪"
    },

    {
        shape: [
            [1,0,0],
            [1,1,1]
        ],
        emoji: "🟦"
    },

    {
        shape: [
            [0,0,1],
            [1,1,1]
        ],
        emoji: "🟧"
    },

    {
        shape: [
            [0,1,1],
            [1,1,0]
        ],
        emoji: "🟩"
    },

    {
        shape: [
            [1,1,0],
            [0,1,1]
        ],
        emoji: "🔵"
    }

];


/* =========================================
   TETRIS CANVAS
========================================= */

function setupTetrisCanvas() {

    const size =
        Math.min(
            window.innerWidth - 40,
            390
        );


    tetrisCanvas.width =
        size;


    tetrisCanvas.height =
        Math.floor(
            size * TH / TW
        );
}


function createTetrisBoard() {

    return Array.from(
        {
            length: TH
        },
        () =>
            Array(TW).fill(null)
    );
}


function openTetris() {

    currentGame = "tetris";

    showScreen("tetrisScreen");

    setupTetrisCanvas();

    restartTetris();
}


/* =========================================
   RESTART TETRIS
========================================= */

function restartTetris() {

    clearTimeout(tetrisTimer);

    tetrisBoard =
        createTetrisBoard();

    tetrisScore = 0;

    tetrisRunning = true;

    updateTetrisScore();

    spawnPiece();

    drawTetris();

    tetrisLoop();
}


/* =========================================
   НОВАЯ ФИГУРА
========================================= */

function spawnPiece() {

    const template =
        pieces[
            Math.floor(
                Math.random() *
                pieces.length
            )
        ];


    currentPiece = {

        shape:
            template.shape.map(
                row =>
                    row.slice()
            ),

        emoji:
            template.emoji,

        x:
            Math.floor(
                (
                    TW -
                    template.shape[0].length
                ) / 2
            ),

        y: 0

    };


    if (
        !validTetrisMove(
            0,
            0,
            currentPiece.shape
        )
    ) {

        tetrisGameOver();

    }
}


/* =========================================
   ПРОВЕРКА
========================================= */

function validTetrisMove(
    dx,
    dy,
    shape
) {

    for (
        let y = 0;
        y < shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < shape[y].length;
            x++
        ) {

            if (!shape[y][x]) {
                continue;
            }


            const nx =
                currentPiece.x +
                x +
                dx;


            const ny =
                currentPiece.y +
                y +
                dy;


            if (

                nx < 0 ||

                nx >= TW ||

                ny >= TH

            ) {

                return false;

            }


            if (

                ny >= 0 &&

                tetrisBoard[ny][nx]

            ) {

                return false;

            }

        }
    }

    return true;
}


/* =========================================
   ПОВОРОТ
========================================= */

function rotateShape(shape) {

    const rows =
        shape.length;

    const cols =
        shape[0].length;


    const result =
        Array.from(
            {
                length: cols
            },
            () =>
                Array(rows).fill(0)
        );


    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            result[x][
                rows - 1 - y
            ] =
                shape[y][x];

        }
    }


    return result;
}


function rotateTetris() {

    if (!tetrisRunning) {
        return;
    }


    const rotated =
        rotateShape(
            currentPiece.shape
        );


    if (
        validTetrisMove(
            0,
            0,
            rotated
        )
    ) {

        currentPiece.shape =
            rotated;

        drawTetris();

        haptic();

    }
}


/* =========================================
   ДВИЖЕНИЕ
========================================= */

function moveTetris(dx) {

    if (!tetrisRunning) {
        return;
    }


    if (
        validTetrisMove(
            dx,
            0,
            currentPiece.shape
        )
    ) {

        currentPiece.x += dx;

        drawTetris();

    }
}


/* =========================================
   SOFT DROP
========================================= */

function softDrop() {

    if (!tetrisRunning) {
        return;
    }


    if (
        validTetrisMove(
            0,
            1,
            currentPiece.shape
        )
    ) {

        currentPiece.y++;

        tetrisScore++;

        updateTetrisScore();

        drawTetris();

    }

    else {

        lockPiece();

    }
}


/* =========================================
   HARD DROP
========================================= */

function hardDrop() {

    if (!tetrisRunning) {
        return;
    }


    let distance = 0;


    while (
        validTetrisMove(
            0,
            1,
            currentPiece.shape
        )
    ) {

        currentPiece.y++;

        distance++;

    }


    tetrisScore +=
        distance * 2;


    updateTetrisScore();

    lockPiece();

    haptic();
}


/* =========================================
   ЗАКРЕПЛЕНИЕ
========================================= */

function lockPiece() {

    const shape =
        currentPiece.shape;


    for (
        let y = 0;
        y < shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < shape[y].length;
            x++
        ) {

            if (!shape[y][x]) {
                continue;
            }


            const bx =
                currentPiece.x +
                x;


            const by =
                currentPiece.y +
                y;


            if (

                by >= 0 &&

                by < TH &&

                bx >= 0 &&

                bx < TW

            ) {

                tetrisBoard[by][bx] =
                    currentPiece.emoji;

            }

        }
    }


    clearLines();

    spawnPiece();

    drawTetris();
}


/* =========================================
   ЛИНИИ
========================================= */

function clearLines() {

    let lines = 0;


    tetrisBoard =
        tetrisBoard.filter(
            row => {

                if (
                    row.every(
                        cell =>
                            cell !== null
                    )
                ) {

                    lines++;

                    return false;

                }

                return true;

            }
        );


    while (
        tetrisBoard.length < TH
    ) {

        tetrisBoard.unshift(
            Array(TW).fill(null)
        );

    }


    if (lines === 1) {

        tetrisScore += 100;

    }

    if (lines === 2) {

        tetrisScore += 300;

    }

    if (lines === 3) {

        tetrisScore += 600;

    }

    if (lines >= 4) {

        tetrisScore += 1000;

    }


    if (lines > 0) {

        updateTetrisScore();

        haptic();

    }
}


/* =========================================
   СЧЁТ ТЕТРИСА
========================================= */

function updateTetrisScore() {

    document
        .getElementById(
            "tetrisScore"
        )
        .textContent =
        "🏆 " + tetrisScore;
}


/* =========================================
   РИСОВАНИЕ ТЕТРИСА
========================================= */

function drawTetris() {

    const cellW =
        tetrisCanvas.width / TW;


    const cellH =
        tetrisCanvas.height / TH;


    tetrisCtx.clearRect(
        0,
        0,
        tetrisCanvas.width,
        tetrisCanvas.height
    );


    tetrisCtx.fillStyle =
        "#0b0f1a";


    tetrisCtx.fillRect(
        0,
        0,
        tetrisCanvas.width,
        tetrisCanvas.height
    );


    tetrisCtx.strokeStyle =
        "rgba(255,255,255,.025)";


    for (
        let x = 0;
        x <= TW;
        x++
    ) {

        tetrisCtx.beginPath();

        tetrisCtx.moveTo(
            x * cellW,
            0
        );

        tetrisCtx.lineTo(
            x * cellW,
            tetrisCanvas.height
        );

        tetrisCtx.stroke();

    }


    for (
        let y = 0;
        y <= TH;
        y++
    ) {

        tetrisCtx.beginPath();

        tetrisCtx.moveTo(
            0,
            y * cellH
        );

        tetrisCtx.lineTo(
            tetrisCanvas.width,
            y * cellH
        );

        tetrisCtx.stroke();

    }


    /* сохранённые */

    for (
        let y = 0;
        y < TH;
        y++
    ) {

        for (
            let x = 0;
            x < TW;
            x++
        ) {

            if (
                tetrisBoard[y][x]
            ) {

                drawBlock(
                    x,
                    y,
                    tetrisBoard[y][x]
                );

            }
        }
    }


    /* текущая */

    if (currentPiece) {

        const shape =
            currentPiece.shape;


        for (
            let y = 0;
            y < shape.length;
            y++
        ) {

            for (
                let x = 0;
                x < shape[y].length;
                x++
            ) {

                if (!shape[y][x]) {
                    continue;
                }


                drawBlock(
                    currentPiece.x + x,
                    currentPiece.y + y,
                    currentPiece.emoji
                );

            }
        }
    }
}


/* =========================================
   БЛОК
========================================= */

function drawBlock(
    x,
    y,
    emoji
) {

    if (

        x < 0 ||
        x >= TW ||
        y < 0 ||
        y >= TH

    ) {

        return;
    }


    const cellW =
        tetrisCanvas.width / TW;


    const cellH =
        tetrisCanvas.height / TH;


    tetrisCtx.font =
        `${Math.floor(
            Math.min(
                cellW,
                cellH
            ) * .88
        )}px serif`;


    tetrisCtx.textAlign =
        "center";


    tetrisCtx.textBaseline =
        "middle";


    tetrisCtx.fillText(
        emoji,

        x * cellW +
            cellW / 2,

        y * cellH +
            cellH / 2
    );
}


/* =========================================
   ЦИКЛ ТЕТРИСА
========================================= */

function tetrisLoop() {

    if (!tetrisRunning) {
        return;
    }


    const level =
        Math.floor(
            tetrisScore / 500
        );


    const speed =
        Math.max(
            100,
            650 -
            level * 45
        );


    tetrisTimer =
        setTimeout(
            () => {

                if (
                    validTetrisMove(
                        0,
                        1,
                        currentPiece.shape
                    )
                ) {

                    currentPiece.y++;

                }

                else {

                    lockPiece();

                }


                drawTetris();

                tetrisLoop();

            },
            speed
        );
}


/* =========================================
   GAME OVER TETRIS
========================================= */

function tetrisGameOver() {

    tetrisRunning = false;

    clearTimeout(tetrisTimer);

    showGameOver(
        "🧱 ТЕТРИС ОКОНЧЕН",
        tetrisScore
    );
}


/* =========================================
   СВАЙПЫ ТЕТРИСА
========================================= */

tetrisCanvas.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();


        const touch =
            e.changedTouches[0];


        tetrisTouchStartX =
            touch.clientX;


        tetrisTouchStartY =
            touch.clientY;

    },
    {
        passive: false
    }
);


tetrisCanvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


tetrisCanvas.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();


        const touch =
            e.changedTouches[0];


        const dx =
            touch.clientX -
            tetrisTouchStartX;


        const dy =
            touch.clientY -
            tetrisTouchStartY;


        const minSwipe = 20;


        /* тап */

        if (

            Math.abs(dx) < minSwipe &&

            Math.abs(dy) < minSwipe

        ) {

            rotateTetris();

            return;

        }


        /* горизонт */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                moveTetris(1);

            }

            else {

                moveTetris(-1);

            }

            return;
        }


        /* вниз */

        if (dy > 0) {

            hardDrop();

            return;
        }


        /* вверх */

        if (dy < 0) {

            rotateTetris();

        }

    },
    {
        passive: false
    }
);


/* =========================================
   GAME OVER UI
========================================= */

function showGameOver(
    title,
    score
) {

    document
        .getElementById(
            "gameOverTitle"
        )
        .textContent =
        title;


    document
        .getElementById(
            "gameOverScore"
        )
        .textContent =
        "🏆 Очки: " + score;


    document
        .getElementById(
            "gameOver"
        )
        .classList.add("active");
}


function closeGameOver() {

    document
        .getElementById(
            "gameOver"
        )
        .classList.remove("active");


    showScreen("menu");
}


function restartCurrentGame() {

    document
        .getElementById(
            "gameOver"
        )
        .classList.remove("active");


    if (
        currentGame === "snake"
    ) {

        showScreen(
            "snakeScreen"
        );

        restartSnake();

    }

    else {

        showScreen(
            "tetrisScreen"
        );

        restartTetris();

    }
}


/* =========================================
   HAPTIC
========================================= */

function haptic() {

    if (tg) {

        try {

            tg.HapticFeedback
                .impactOccurred(
                    "light"
                );

        }

        catch(e) {}

    }
}


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        const active =
            document.querySelector(
                ".screen.active"
            );


        if (

            active &&

            active.id ===
                "snakeScreen"

        ) {

            setupSnakeCanvas();

            drawSnake();

        }


        if (

            active &&

            active.id ===
                "tetrisScreen"

        ) {

            setupTetrisCanvas();

            drawTetris();

        }

    }
);


/* =========================================
   ДОПОЛНИТЕЛЬНАЯ ЗАЩИТА
   ОТ СВАЙПА СТРАНИЦЫ
========================================= */

document.addEventListener(
    "touchmove",
    function(e) {

        const target =
            e.target;


        /*
           Если палец находится
           внутри игрового поля —
           полностью блокируем
           системный scroll/swipe.
        */

        if (

            target === snakeCanvas ||

            target === tetrisCanvas

        ) {

            e.preventDefault();

        }

    },
    {
        passive: false
    }
);

</script>
