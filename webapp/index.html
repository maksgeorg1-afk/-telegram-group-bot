<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UA Games 3D</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050714;
  --panel:#10152d;
  --panel2:#171d3d;
  --line:rgba(255,255,255,.11);
  --text:#f7f8ff;
  --muted:#929ab8;
  --purple:#8b5cf6;
  --blue:#28a9ff;
  --cyan:#31e6ff;
  --pink:#ff3bd4;
  --green:#43f7a1;
  --red:#ff557a;
  --yellow:#ffd84d;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  position:fixed;
  inset:0;
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  max-width:620px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(111,76,255,.2),transparent 28%),
    radial-gradient(circle at 90% 25%,rgba(0,207,255,.12),transparent 25%),
    #050714;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  padding:
    max(16px,env(safe-area-inset-top))
    16px
    max(20px,env(safe-area-inset-bottom));
}

.screen.active{
  display:block;
}

#menu{
  scroll-behavior:smooth;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:8px 0 18px;
}

.logo{
  font-size:28px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo span{
  background:linear-gradient(90deg,#6d5cff,#27dfff,#ff45da);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.profile{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  border-radius:16px;
  font-weight:900;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6d5cff,#ff42d2);
}

.hero{
  position:relative;
  min-height:215px;
  border:1px solid rgba(133,104,255,.25);
  border-radius:28px;
  overflow:hidden;
  padding:24px;
  background:
    radial-gradient(circle at 75% 40%,rgba(69,191,255,.22),transparent 20%),
    radial-gradient(circle at 90% 70%,rgba(255,43,214,.18),transparent 24%),
    linear-gradient(145deg,#111738,#080b1d 65%,#11102a);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
}

.hero:before{
  content:"";
  position:absolute;
  inset:-40%;
  background:conic-gradient(
    from 0deg,
    transparent,
    rgba(88,91,255,.15),
    transparent 30%
  );
  animation:spin 16s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hero>*{
  position:relative;
  z-index:1;
}

.hero h1{
  font-size:34px;
  line-height:1;
  margin:18px 0 10px;
}

.hero p{
  color:#aeb6d0;
  max-width:350px;
  line-height:1.45;
  margin:0 0 18px;
}

.primary{
  border:0;
  border-radius:16px;
  padding:13px 18px;
  font-weight:900;
  background:linear-gradient(135deg,#7c4dff,#237cff);
  box-shadow:0 10px 30px rgba(94,71,255,.3);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:14px 0;
}

.stat{
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  border-radius:17px;
  padding:12px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.stat b{
  font-size:17px;
}

.progress{
  height:6px;
  background:rgba(255,255,255,.09);
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,#8d5cff,#24ddff);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 11px;
}

.section-title h2{
  font-size:20px;
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  padding-bottom:25px;
}

.card{
  position:relative;
  min-height:145px;
  border:1px solid var(--line);
  border-radius:21px;
  padding:15px;
  overflow:hidden;
  text-align:left;
  background:
    linear-gradient(
      145deg,
      rgba(25,30,61,.95),
      rgba(8,11,25,.96)
    );
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:.15s;
}

.card:before{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  right:-35px;
  top:-35px;
  background:var(--glow);
  filter:blur(24px);
  opacity:.28;
}

.card:active{
  transform:scale(.96);
}

.card .icon{
  position:relative;
  display:block;
  font-size:39px;
  margin-bottom:13px;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.4));
}

.card b,
.card small{
  position:relative;
}

.card b{
  font-size:16px;
}

.card small{
  display:block;
  color:#8992b0;
  margin-top:5px;
}

#game{
  padding:0;
  overflow:hidden;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.game-ui{
  position:absolute;
  inset:0;
  pointer-events:none;
  padding:
    max(13px,env(safe-area-inset-top))
    14px
    max(14px,env(safe-area-inset-bottom));
}

.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.hud{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.pill{
  padding:8px 11px;
  border-radius:13px;
  background:rgba(5,7,20,.62);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  font-size:12px;
  font-weight:900;
}

.game-button{
  pointer-events:auto;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(5,7,20,.62);
  backdrop-filter:blur(10px);
  width:43px;
  height:43px;
  border-radius:14px;
  font-size:18px;
}

.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  pointer-events:none;
}

.center-box{
  padding:25px;
  border-radius:25px;
  background:rgba(5,7,20,.55);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
  max-width:330px;
}

.center-box h2{
  margin:0 0 8px;
  font-size:30px;
}

.center-box p{
  color:var(--muted);
  margin:0;
}

.bottom-controls{
  position:absolute;
  left:0;
  right:0;
  bottom:max(20px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  gap:14px;
  pointer-events:auto;
  padding:0 15px;
}

.control{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(8,12,29,.65);
  backdrop-filter:blur(10px);
  border-radius:18px;
  min-width:65px;
  min-height:55px;
  font-size:22px;
  font-weight:900;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(3,5,15,.74);
  backdrop-filter:blur(12px);
  z-index:50;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:390px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:linear-gradient(145deg,#151a39,#090c20);
  padding:27px;
  text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
}

.modal h2{
  font-size:29px;
  margin:0 0 8px;
}

.modal p{
  color:var(--muted);
  line-height:1.5;
}

.modal .primary{
  width:100%;
  margin-top:8px;
}

.secondary{
  width:100%;
  margin-top:9px;
  padding:13px;
  border-radius:15px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  font-weight:900;
}

.game-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:78px;
  font-size:17px;
  font-weight:1000;
  text-shadow:0 0 20px #31e6ff;
}

.touch-zone{
  position:absolute;
  inset:0;
  pointer-events:auto;
  touch-action:none;
}

@media(max-width:380px){
  .hero h1{font-size:29px}
  .card{min-height:130px}
}
</style>
</head>

<body>

<div id="app">

<section id="menu" class="screen active">

  <div class="brand">
    <div class="logo"><span>UA</span> GAMES</div>

    <div class="profile">
      <div class="avatar">👤</div>
      <span id="level">LVL 1</span>
    </div>
  </div>

  <div class="hero">

    <div style="

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";


/* =========================================================
   TELEGRAM
========================================================= */

const tg=window.Telegram?.WebApp;

if(tg){

  tg.ready();
  tg.expand();

  try{
    tg.disableVerticalSwipes?.();
  }catch(e){}

  try{
    tg.setHeaderColor("#050714");
    tg.setBackgroundColor("#050714");
  }catch(e){}

}


/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

const profile=JSON.parse(
  localStorage.getItem("ua_games_profile") ||
  '{"xp":0,"coins":100,"best":0,"level":1}'
);

function save(){

  localStorage.setItem(
    "ua_games_profile",
    JSON.stringify(profile)
  );

  updateProfile();

}

function updateProfile(){

  $("xp").textContent=profile.xp;
  $("coins").textContent=profile.coins;
  $("best").textContent=profile.best;
  $("level").textContent="LVL "+profile.level;

  $("xpBar").style.width=
    (profile.xp%100)+"%";

}

updateProfile();


function reward(score){

  const coins=Math.max(
    1,
    Math.floor(score/10)
  );

  const xp=Math.max(
    5,
    Math.floor(score/5)
  );

  profile.coins+=coins;
  profile.xp+=xp;

  profile.level=
    1+Math.floor(profile.xp/100);

  if(score>profile.best){
    profile.best=score;
  }

  save();

  return {
    coins,
    xp
  };

}


/* =========================================================
   GLOBAL GAME
========================================================= */

let currentGame=null;
let running=false;
let paused=false;
let score=0;
let lives=3;

let animation=0;

let scene=null;
let camera=null;
let renderer=null;

let objects=[];
let gameState={};

const canvas=$("gameCanvas");


/* =========================================================
   3D ENGINE
========================================================= */

function init3D(){

  if(renderer)return;

  scene=new THREE.Scene();

  scene.fog=new THREE.FogExp2(
    0x050714,
    .025
  );

  camera=new THREE.PerspectiveCamera(
    55,
    innerWidth/innerHeight,
    .1,
    300
  );

  camera.position.set(
    0,
    0,
    18
  );

  renderer=
    new THREE.WebGLRenderer({
      canvas,
      antialias:true,
      powerPreference:"high-performance"
    });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setClearColor(
    0x050714,
    1
  );

  renderer.outputColorSpace=
    THREE.SRGBColorSpace;

  scene.add(
    new THREE.AmbientLight(
      0x6474ff,
      1.8
    )
  );

  const light=
    new THREE.PointLight(
      0x32ddff,
      30,
      80
    );

  light.position.set(
    0,
    4,
    10
  );

  scene.add(light);

  const pink=
    new THREE.PointLight(
      0xff2fcb,
      20,
      60
    );

  pink.position.set(
    -8,
    -3,
    6
  );

  scene.add(pink);

  createStars();

  addEventListener(
    "resize",
    resize
  );

}

function resize(){

  if(!renderer)return;

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

function createStars(){

  const count=900;

  const geometry=
    new THREE.BufferGeometry();

  const positions=
    new Float32Array(
      count*3
    );

  for(let i=0;i<count;i++){

    positions[i*3]=
      (Math.random()-.5)*100;

    positions[i*3+1]=
      (Math.random()-.5)*70;

    positions[i*3+2]=
      -Math.random()*180;

  }

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  const material=
    new THREE.PointsMaterial({
      color:0x9edfff,
      size:.17,
      transparent:true,
      opacity:.8
    });

  const stars=
    new THREE.Points(
      geometry,
      material
    );

  stars.userData.stars=true;

  scene.add(stars);

  objects.push(stars);

}


/* =========================================================
   CLEAR SCENE
========================================================= */

function clearScene(){

  for(const obj of objects){

    if(obj.parent){
      obj.parent.remove(obj);
    }

  }

  objects=[];

  if(scene){

    scene.traverse(obj=>{

      if(
        obj.geometry &&
        obj.userData.gameObject
      ){
        obj.geometry.dispose?.();
        obj.material?.dispose?.();
      }

    });

  }

}


/* =========================================================
   START GAME
========================================================= */

window.startGame=function(name){

  $("menu").classList.remove(
    "active"
  );

  $("game").classList.add(
    "active"
  );

  $("modal").classList.remove(
    "show"
  );

  init3D();

  currentGame=name;
  running=true;
  paused=false;
  score=0;
  lives=3;

  gameState={};

  updateHUD();

  clearScene();

  setupControls();

  $("gameTitle").textContent=
    gameNames[name]||"UA GAMES";

  const fn=
    gameInitializers[name];

  if(fn){
    fn();
  }

};


const gameNames={

  space:"🚀 КОСМОС",
  memory:"🧠 ПАМЯТЬ",
  mines:"💣 САПЁР",
  pong:"🏓 ПОНГ",
  breakout:"🧱 БРЕЙКАУТ",
  flappy:"🐦 ФЛОППИ",
  runner:"🏃 РАННЕР",
  reaction:"⚡ РЕАКЦИЯ",

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  $("gameScore").textContent=
    score;

  $("gameLives").textContent=
    lives;

  $("gameCoins").textContent=
    profile.coins;

}

function addScore(n){

  score+=n;

  updateHUD();

}


/* =========================================================
   CENTER MESSAGE
========================================================= */

function message(title,text=""){

  $("center").innerHTML=`
    <div class="center-box">
      <h2>${title}</h2>
      <p>${text}</p>
    </div>
  `;

}

function clearMessage(){

  $("center").innerHTML="";

}


/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

  const c=$("controls");

  c.innerHTML="";

  const make=(text,fn)=>{

    const b=document.createElement(
      "button"
    );

    b.className="control";
    b.textContent=text;

    b.addEventListener(
      "touchstart",
      e=>{
        e.preventDefault();
        fn();
      },
      {passive:false}
    );

    b.addEventListener(
      "mousedown",
      fn
    );

    c.appendChild(b);

    return b;

  };

  gameState.makeControl=make;

}


/* =========================================================
   END GAME
========================================================= */

function endGame(title="Игра окончена"){

  if(!running)return;

  running=false;

  const rewardData=
    reward(score);

  $("modalTitle").textContent=
    title;

  $("modalText").innerHTML=`
    Результат:
    <b>${score}</b>
    <br><br>
    🪙 +${rewardData.coins}
    &nbsp;
    ⭐ +${rewardData.xp} XP
    <br><br>
    Лучший результат:
    <b>${profile.best}</b>
  `;

  $("modalMain").textContent=
    "🔄 Играть снова";

  $("modalMain").onclick=()=>{
    $("modal").classList.remove(
      "show"
    );
    startGame(currentGame);
  };

  $("modal").classList.add(
    "show"
  );

}


window.backMenu=function(){

  running=false;
  paused=false;

  $("modal").classList.remove(
    "show"
  );

  $("game").classList.remove(
    "active"
  );

  $("menu").classList.add(
    "active"
  );

  clearScene();

  updateProfile();

};

/* =========================================================
   TOUCH / UNIVERSAL TAP
========================================================= */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    if(!running || paused)return;

    const t=e.touches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

    gameState.touching=true;

    if(
      gameState.onTap
    ){
      gameState.onTap(
        t.clientX,
        t.clientY
      );
    }

  },
  {passive:true}
);

canvas.addEventListener(
  "touchmove",
  e=>{

    if(!running || paused)return;

    const t=e.touches[0];

    const dx=
      t.clientX-touchStartX;

    const dy=
      t.clientY-touchStartY;

    if(gameState.onMove){

      gameState.onMove(
        dx,
        dy
      );

    }

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  ()=>{

    gameState.touching=false;

    if(gameState.onEnd){
      gameState.onEnd();
    }

  }
);


/* =========================================================
   3D HELPERS
========================================================= */

function cube(
  color,
  x=0,
  y=0,
  z=0,
  size=1
){

  const mesh=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        size,
        size,
        size
      ),

      new THREE.MeshStandardMaterial({
        color,
        metalness:.45,
        roughness:.25,
        emissive:color,
        emissiveIntensity:.12
      })

    );

  mesh.position.set(
    x,y,z
  );

  mesh.userData.gameObject=true;

  scene.add(mesh);
  objects.push(mesh);

  return mesh;

}

function sphere(
  color,
  x=0,
  y=0,
  z=0,
  size=1
){

  const mesh=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        size,
        18,
        14
      ),

      new THREE.MeshStandardMaterial({
        color,
        metalness:.35,
        roughness:.18,
        emissive:color,
        emissiveIntensity:.2
      })

    );

  mesh.position.set(
    x,y,z
  );

  mesh.userData.gameObject=true;

  scene.add(mesh);
  objects.push(mesh);

  return mesh;

}


/* =========================================================
   GAME 1 — SPACE
========================================================= */

function initSpace(){

  gameState.player={
    x:0,
    y:-1
  };

  gameState.enemies=[];
  gameState.lasers=[];
  gameState.timer=0;

  camera.position.set(
    0,0,18
  );

  clearMessage();

  message(
    "🚀 КОСМОС",
    "Свайпай пальцем, чтобы двигаться. Тапай по экрану для выстрела."
  );

  setTimeout(
    clearMessage,
    1800
  );

  gameState.onMove=(dx,dy)=>{

    gameState.player.x=
      Math.max(
        -7,
        Math.min(
          7,
          gameState.player.x+
          dx*.025
        )
      );

    gameState.player.y=
      Math.max(
        -4,
        Math.min(
          4,
          gameState.player.y-
          dy*.025
        )
      );

  };

  gameState.onTap=()=>{

    if(
      gameState.shootCooldown>0
    )return;

    gameState.shootCooldown=.15;

    const bullet=
      sphere(
        0x31e6ff,
        gameState.player.x,
        gameState.player.y,
        10,
        .12
      );

    bullet.userData.bullet=true;

    gameState.lasers.push(
      bullet
    );

  };

}

function updateSpace(dt){

  if(!gameState.player)return;

  gameState.timer+=dt;

  if(
    gameState.shootCooldown>0
  ){
    gameState.shootCooldown-=dt;
  }

  if(
    !gameState.ship
  ){

    gameState.ship=
      cube(
        0x5b7cff,
        0,
        -1,
        10,
        1.4
      );

  }

  const ship=
    gameState.ship;

  ship.position.x+=
    (gameState.player.x-
     ship.position.x)*.15;

  ship.position.y+=
    (gameState.player.y-
     ship.position.y)*.15;

  if(
    Math.random()<
    dt*.8
  ){

    const enemy=
      sphere(
        Math.random()<
        .5?0xff3b91:0x9d55ff,

        (Math.random()-.5)*14,

        (Math.random()-.5)*8,

        -40,

        .6
      );

    enemy.userData.enemy=true;

    gameState.enemies.push(
      enemy
    );

  }

  for(
    let i=
    gameState.lasers.length-1;
    i>=0;
    i--
  ){

    const b=
      gameState.lasers[i];

    b.position.z-=35*dt;

    for(
      let j=
      gameState.enemies.length-1;
      j>=0;
      j--
    ){

      const e=
        gameState.enemies[j];

      if(
        b.position.distanceTo(
          e.position
        )<.9
      ){

        scene.remove(b);
        scene.remove(e);

        gameState.lasers.splice(i,1);
        gameState.enemies.splice(j,1);

        addScore(100);

        break;

      }

    }

    if(
      b.position.z<-50
    ){

      scene.remove(b);

      gameState.lasers.splice(
        i,1
      );

    }

  }

  for(
    let i=
    gameState.enemies.length-1;
    i>=0;
    i--
  ){

    const e=
      gameState.enemies[i];

    e.position.z+=
      8*dt;

    if(
      e.position.distanceTo(
        ship.position
      )<1.3
    ){

      scene.remove(e);

      gameState.enemies.splice(
        i,1
      );

      lives--;

      updateHUD();

      if(lives<=0){
        endGame(
          "💥 Корабль уничтожен"
        );
        return;
      }

    }

    if(
      e.position.z>20
    ){

      scene.remove(e);

      gameState.enemies.splice(
        i,1
      );

    }

  }

}


/* =========================================================
   GAME 2 — PONG
========================================================= */

function initPong(){

  clearMessage();

  gameState.ball={
    x:0,
    y:0,
    vx:7,
    vy:4
  };

  gameState.player=0;

  gameState.paddle=
    cube(
      0x31e6ff,
      0,
      -6,
      0,
      2
    );

  gameState.enemy=
    cube(
      0xff3bd4,
      0,
      6,
      0,
      2
    );

  gameState.ballObj=
    sphere(
      0xffffff,
      0,
      0,
      0,
      .45
    );

  gameState.onMove=(dx)=>{
    gameState.player=
      Math.max(
        -7,
        Math.min(
          7,
          gameState.player+
          dx*.03
        )
      );
  };

}

function updatePong(dt){

  const s=gameState;

  if(!s.ball)return;

  s.ball.x+=
    s.ball.vx*dt;

  s.ball.y+=
    s.ball.vy*dt;

  if(
    s.ball.x>7 ||
    s.ball.x<-7
  ){

    s.ball.vx*=-1;

  }

  s.paddle.position.x=
    s.player;

  s.enemy.position.x=
    s.ball.x*.65;

  s.ballObj.position.x=
    s.ball.x;

  s.ballObj.position.y=
    s.ball.y;

  if(
    Math.abs(
      s.ball.y+6
    )<.5 &&
    Math.abs(
      s.ball.x-s.player
    )<1.7
  ){

    s.ball.vy=
      Math.abs(s.ball.vy);

    addScore(10);

  }

  if(
    Math.abs(
      s.ball.y-6
    )<.5 &&
    Math.abs(
      s.ball.x-s.enemy.position.x
    )<1.7
  ){

    s.ball.vy=
      -Math.abs(s.ball.vy);

  }

  if(
    s.ball.y>8
  ){

    s.ball.y=0;
    s.ball.x=0;
    s.ball.vy=-5;

    lives--;

    updateHUD();

  }

  if(
    s.ball.y<-8
  ){

    s.ball.y=0;
    s.ball.x=0;
    s.ball.vy=5;

    addScore(50);

  }

  if(lives<=0){
    endGame("🏓 Партия окончена");
  }

}


/* =========================================================
   GAME 3 — BREAKOUT
========================================================= */

function initBreakout(){

  gameState.ball={
    x:0,
    y:-4,
    vx:5,
    vy:7
  };

  gameState.paddle=
    cube(
      0x31e6ff,
      0,
      -7,
      0,
      2.5
    );

  gameState.blocks=[];

  for(
    let y=0;
    y<4;
    y++
  ){

    for(
      let x=-5;
      x<=5;
      x+=2.5
    ){

      const b=
        cube(
          [
            0xff3bd4,
            0x8b5cf6,
            0x31e6ff,
            0x43f7a1
          ][y],

          x,
          y*1.2+1,
          0,
          1
        );

      gameState.blocks.push(
        b
      );

    }

  }

  gameState.ballObj=
    sphere(
      0xffffff,
      0,
      -4,
      0,
      .4
    );

  gameState.onMove=(dx)=>{
    gameState.paddle.position.x=
      Math.max(
        -7,
        Math.min(
          7,
          gameState.paddle.position.x+
          dx*.03
        )
      );
  };

}

function updateBreakout(dt){

  const s=gameState;

  s.ball.x+=
    s.ball.vx*dt;

  s.ball.y+=
    s.ball.vy*dt;

  if(
    Math.abs(s.ball.x)>8
  ){
    s.ball.vx*=-1;
  }

  if(
    s.ball.y>8
  ){
    s.ball.vy*=-1;
  }

  if(
    s.ball.y<-8
  ){

    lives--;

    s.ball.x=0;
    s.ball.y=-4;
    s.ball.vy=7;

    updateHUD();

  }

  if(
    s.ball.y<-6.2 &&
    s.ball.y>-7.5 &&
    Math.abs(
      s.ball.x-
      s.paddle.position.x
    )<2
  ){

    s.ball.vy=
      Math.abs(s.ball.vy);

  }

  for(
    let i=
    s.blocks.length-1;
    i>=0;
    i--
  ){

    const b=s.blocks[i];

    if(
      Math.abs(
        s.ball.x-b.position.x
      )<.9 &&
      Math.abs(
        s.ball.y-b.position.y
      )<.8
    ){

      scene.remove(b);
      s.blocks.splice(i,1);

      s.ball.vy*=-1;

      addScore(25);

    }

  }

  s.ballObj.position.x=
    s.ball.x;

  s.ballObj.position.y=
    s.ball.y;

  if(
    s.blocks.length===0
  ){

    addScore(500);
    endGame(
      "🏆 Стена уничтожена!"
    );

  }

  if(lives<=0){

    endGame(
      "💥 Мяч потерян"
    );

  }

}


/* =========================================================
   GAME 4 — FLAPPY
========================================================= */

function initFlappy(){

  gameState.y=0;
  gameState.v=0;
  gameState.pipes=[];
  gameState.timer=0;

  gameState.bird=
    sphere(
      0xffd83d,
      -4,
      0,
      0,
      .7
    );

  gameState.onTap=()=>{
    gameState.v=8;
  };

  message(
    "🐦 ФЛОППИ",
    "Тапай по экрану, чтобы лететь вверх"
  );

  setTimeout(
    clearMessage,
    1300
  );

}

function updateFlappy(dt){

  const s=gameState;

  s.v-=18*dt;
  s.y+=s.v*dt;

  s.bird.position.y=
    s.y;

  s.timer-=dt;

  if(
    s.timer<=0
  ){

    s.timer=1.6;

    const gap=
      (Math.random()-.5)*4;

    const top=
      cube(
        0x43f7a1,
        9,
        gap+5,
        0,
        2
      );

    const bottom=
      cube(
        0x43f7a1,
        9,
        gap-5,
        0,
        2
      );

    top.scale.y=3;
    bottom.scale.y=3;

    s.pipes.push(
      top,
      bottom
    );

  }

  for(
    let i=s.pipes.length-1;
    i>=0;
    i--
  ){

    const p=s.pipes[i];

    p.position.x-=5*dt;

    if(
      Math.abs(
        p.position.x+
        4
      )<.8 &&
      Math.abs(
        s.y-p.position.y
      )<2
    ){

      lives--;

      updateHUD();

    }

    if(
      p.position.x<-10
    ){

      scene.remove(p);
      s.pipes.splice(i,1);

      addScore(10);

    }

  }

  if(
    s.y>7 ||
    s.y<-8 ||
    lives<=0
  ){

    endGame(
      "🐦 Полёт окончен"
    );

  }

}


/* =========================================================
   GAME 5 — RUNNER
========================================================= */

function initRunner(){

  gameState.x=0;
  gameState.speed=7;
  gameState.obstacles=[];
  gameState.timer=0;

  gameState.player=
    cube(
      0x8b5cf6,
      0,
      -4,
      5,
      1.2
    );

  gameState.onMove=(dx)=>{
    if(
      Math.abs(dx)>30
    ){
      gameState.x+=
        dx>0?3:-3;

      gameState.x=
        Math.max(
          -5,
          Math.min(
            5,
            gameState.x
          )
        );
    }
  };

  gameState.onTap=()=>{
    if(!gameState.jump){
      gameState.jump=true;
      gameState.v=9;
    }
  };

}

function updateRunner(dt){

  const s=gameState;

  if(s.jump){

    s.v-=20*dt;

    s.player.position.y+=
      s.v*dt;

    if(
      s.player.position.y<=-4
    ){

      s.player.position.y=-4;
      s.jump=false;

    }

  }

  s.player.position.x=
    s.x;

  s.timer-=dt;

  if(
    s.timer<=0
  ){

    s.timer=.8;

    const obstacle=
      cube(
        0xff3b71,
        (Math.random()-.5)*10,
        -4,
        -35,
        1.5
      );

    s.obstacles.push(
      obstacle
    );

  }

  for(
    let i=s.obstacles.length-1;
    i>=0;
    i--
  ){

    const o=s.obstacles[i];

    o.position.z+=
      s.speed*dt;

    if(
      o.position.z>7
    ){

      scene.remove(o);
      s.obstacles.splice(i,1);

      addScore(20);

    }

    if(
      o.position.distanceTo(
        s.player.position
      )<1.4
    ){

      lives--;
      updateHUD();

      scene.remove(o);
      s.obstacles.splice(i,1);

      if(lives<=0){
        endGame(
          "💥 Забег окончен"
        );
      }

    }

  }

  s.speed+=
    dt*.12;

}


/* =========================================================
   GAME 6 — REACTION
========================================================= */

function initReaction(){

  gameState.wait=
    1+
    Math.random()*3;

  gameState.ready=false;
  gameState.started=false;

  message(
    "⚡ РЕАКЦИЯ",
    "Жди зелёный сигнал"
  );

  gameState.onTap=()=>{

    if(
      !gameState.ready
    ){

      if(gameState.started){

        lives--;

        updateHUD();

      }

      return;

    }

    const elapsed=
      performance.now()-
      gameState.startTime;

    const points=
      Math.max(
        10,
        1000-
        Math.floor(elapsed)
      );

    addScore(points);

    endGame(
      "⚡ Отличная реакция!"
    );

  };

}

function updateReaction(dt){

  if(
    gameState.wait>0
  ){

    gameState.wait-=dt;

    return;

  }

  if(
    !gameState.ready
  ){

    gameState.ready=true;
    gameState.startTime=
      performance.now();

    message(
      "🟢 ТАП!",
      "Нажимай!"
    );

  }

}


/* =========================================================
   GAME 7 — SHOOTING
========================================================= */

function initShooting(){

  gameState.targets=[];
  gameState.timer=0;

  gameState.onTap=(x,y)=>{

    const nx=
      x/innerWidth*2-1;

    const ny=
      -(y/innerHeight*2-1);

    for(
      let i=
      gameState.targets.length-1;
      i>=0;
      i--
    ){

      const t=
        gameState.targets[i];

      const dx=
        nx-
        t.userData.screenX;

      const dy=
        ny-
        t.userData.screenY;

      if(
        dx*dx+
        dy*dy<
        .03
      ){

        scene.remove(t);

        gameState.targets.splice(
          i,
          1
        );

        addScore(100);

        break;

      }

    }

  };

}

function updateShooting(dt){

  gameState.timer-=dt;

  if(
    gameState.timer<=0
  ){

    gameState.timer=.7;

    const t=
      sphere(
        0xff557a,
        (Math.random()-.5)*14,
        (Math.random()-.5)*8,
        -5,
        .6
      );

    t.userData.screenX=
      t.position.x/8;

    t.userData.screenY=
      t.position.y/5;

    gameState.targets.push(t);

  }

}


/* =========================================================
   GAME 8 — LIGHTS
========================================================= */

function initLights(){

  gameState.lights=[];
  gameState.active=null;

  for(
    let i=0;
    i<12;
    i++
  ){

    const x=
      (i%4)*3-4.5;

    const y=
      Math.floor(i/4)*3-3;

    const s=
      sphere(
        0x283050,
        x,
        y,
        0,
        .75
      );

    s.userData.index=i;

    gameState.lights.push(s);

  }

  gameState.onTap=(x,y)=>{

    const nx=
      x/innerWidth;

    const ny=
      y/innerHeight;

    const index=
      Math.floor(nx*12)%12;

    const light=
      gameState.lights[index];

    if(light){

      light.material.emissive.set(
        0x31e6ff
      );

      addScore(50);

    }

  };

}

/* =========================================================
   GAME 13 — MEMORY
========================================================= */

function initMemory(){

  const values=[
    "🚀","🚀",
    "🐍","🐍",
    "🎯","🎯",
    "🧩","🧩",
    "⚡","⚡",
    "🎨","🎨"
  ];

  values.sort(
    ()=>Math.random()-.5
  );

  gameState.cards=[];
  gameState.open=[];
  gameState.lock=false;

  values.forEach(
    (v,i)=>{

      const card=
        cube(
          0x252d58,
          (i%4)*2.4-3.6,
          Math.floor(i/4)*2.4-1.2,
          0,
          1.8
        );

      card.userData.value=v;
      card.userData.index=i;

      gameState.cards.push(card);

    }
  );

  gameState.onTap=(x,y)=>{

    if(gameState.lock)return;

    const nx=
      (x/innerWidth-.5)*16;

    const ny=
      -(y/innerHeight-.5)*12;

    let best=null;
    let dist=999;

    for(
      const c of gameState.cards
    ){

      const d=
        Math.hypot(
          nx-c.position.x,
          ny-c.position.y
        );

      if(d<dist){

        dist=d;
        best=c;

      }

    }

    if(
      best &&
      dist<2 &&
      !gameState.open.includes(best)
    ){

      best.material.color.set(
        0x31e6ff
      );

      best.userData.open=true;

      gameState.open.push(
        best
      );

      if(
        gameState.open.length===2
      ){

        const a=
          gameState.open[0];

        const b=
          gameState.open[1];

        if(
          a.userData.value===
          b.userData.value
        ){

          addScore(100);

          gameState.open=[];

          if(
            gameState.cards.every(
              c=>c.userData.open
            )
          ){

            endGame(
              "🧠 Память пройдена!"
            );

          }

        }else{

          gameState.lock=true;

          setTimeout(
            ()=>{
              a.material.color.set(
                0x252d58
              );

              b.material.color.set(
                0x252d58
              );

              a.userData.open=false;
              b.userData.open=false;

              gameState.open=[];
              gameState.lock=false;

            },
            600
          );

        }

      }

    }

  };

}

   GAME 14 — MINES

function initMines(){

  gameState.mines=[];

  for(
    let i=0;
    i<25;
    i++
  ){

    const x=
      (i%5)*2.2-4.4;

    const y=
      Math.floor(i/5)*2.2-4.4;

    const cell=
      cube(
        0x263052,
        x,
        y,
        0,
        1.7
      );

    cell.userData.mine=
      Math.random()<.18;

    cell.userData.open=false;

    gameState.mines.push(
      cell
    );

  }

  gameState.onTap=(x,y)=>{

    const nx=
      (x/innerWidth-.5)*12;

    const ny=
      -(y/innerHeight-.5)*12;

    let closest=null;
    let dist=999;

    for(
      const c of gameState.mines
    ){

      const d=
        Math.hypot(
          nx-c.position.x,
          ny-c.position.y
        );

      if(d<dist){

        dist=d;
        closest=c;

      }

    }

    if(
      !closest ||
      dist>1.5 ||
      closest.userData.open
    )return;

    closest.userData.open=true;

    if(
      closest.userData.mine
    ){

      closest.material.color.set(
        0xff3355
      );

      lives--;

      updateHUD();

      if(lives<=0){

        endGame(
          "💣 Бум!"
        );

      }

    }else{

      closest.material.color.set(
        0x43f7a1
      );

      addScore(25);

    }

  };

}

   GAME 15 — SNAKE
========================================================= */

function initSnake(){

  gameState.snake=[
    {x:0,y:0},
    {x:-1,y:0},
    {x:-2,y:0}
  ];

  gameState.dir={
    x:1,
    y:0
  };

  gameState.food={
    x:
      Math.floor(
        Math.random()*11
      )-5,
    y:
      Math.floor(
        Math.random()*9
      )-4
  };

  gameState.timer=0;

  gameState.snakeObjects=[];

  gameState.onMove=(dx,dy)=>{

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0)
        gameState.dir={
          x:1,y:0
        };
      else
        gameState.dir={
          x:-1,y:0
        };

    }else{

      if(dy>0)
        gameState.dir={
          x:0,y:-1
        };
      else
        gameState.dir={
          x:0,y:1
        };

    }

  };

  drawSnake();

}

function drawSnake(){

  for(
    const o of
    gameState.snakeObjects
  ){
    scene.remove(o);
  }

  gameState.snakeObjects=[];

  for(
    const p of gameState.snake
  ){

    const o=
      cube(
        0x43f7a1,
        p.x*1.3,
        p.y*1.3,
        0,
        1
      );

    gameState.snakeObjects.push(o);

  }

  if(gameState.foodObj){
    scene.remove(
      gameState.foodObj
    );
  }

  gameState.foodObj=
    sphere(
      0xff3bd4,
      gameState.food.x*1.3,
      gameState.food.y*1.3,
      0,
      .55
    );

}

function updateSnake(dt){

  gameState.timer+=dt;

  if(
    gameState.timer<.16
  )return;

  gameState.timer=0;

  const head={
    x:
      gameState.snake[0].x+
      gameState.dir.x,

    y:
      gameState.snake[0].y+
      gameState.dir.y
  };

  if(
    head.x<-5 ||
    head.x>5 ||
    head.y<-4 ||
    head.y>4
  ){

    endGame(
      "🐍 Врезался!"
    );

    return;

  }

  for(
    const p of
    gameState.snake
  ){

    if(
      p.x===head.x &&
      p.y===head.y
    ){

      endGame(
        "🐍 Хвост!"
      );

      return;

    }

  }

  gameState.snake.unshift(
    head
  );

  if(
    head.x===
    gameState.food.x &&
    head.y===
    gameState.food.y
  ){

    addScore(50);

    gameState.food={
      x:
        Math.floor(
          Math.random()*11
        )-5,

      y:
        Math.floor(
          Math.random()*9
        )-4
    };

  }else{

    gameState.snake.pop();

  }

  drawSnake();

}


/* =========================================================
   GAME 16 — TETRIS
========================================================= */

function initTetris(){

  gameState.board=
    Array.from(
      {length:16},
      ()=>Array(8).fill(0)
    );

  gameState.piece={
    x:3,
    y:0,
    shape:[
      [1,1],
      [1,1]
    ]
  };

  gameState.timer=0;

  gameState.onMove=(dx,dy)=>{

    if(
      Math.abs(dx)>30
    ){

      gameState.piece.x+=
        dx>0?1:-1;

      gameState.piece.x=
        Math.max(
          0,
          Math.min(
            6,
            gameState.piece.x
          )
        );

    }

  };

  gameState.onTap=()=>{

    gameState.piece.shape=
      rotate(
        gameState.piece.shape
      );

  };

  drawTetris();

}

function rotate(matrix){

  return matrix[0].map(
    (_,i)=>
      matrix.map(
        row=>
          row[i]
      ).reverse()
  );

}

function drawTetris(){

  if(
    gameState.tetrisObjects
  ){

    for(
      const o of
      gameState.tetrisObjects
    ){
      scene.remove(o);
    }

  }

  gameState.tetrisObjects=[];

  for(
    let y=0;
    y<16;
    y++
  ){

    for(
      let x=0;
      x<8;
      x++
    ){

      if(
        gameState.board[y][x]
      ){

        gameState.tetrisObjects.push(
          cube(
            gameState.board[y][x],
            x*1.4-4.9,
            6-y*1.0,
            0,
            .9
          )
        );

      }

    }

  }

  const p=
    gameState.piece;

  for(
    let y=0;
    y<p.shape.length;
    y++
  ){

    for(
      let x=0;
      x<p.shape[y].length;
      x++
    ){

      if(
        p.shape[y][x]
      ){

        gameState.tetrisObjects.push(
          cube(
            0x8b5cf6,
            (p.x+x)*1.4-4.9,
            6-(p.y+y),
            0,
            .9
          )
        );

      }

    }

  }

}

function collisionTetris(){

  const p=
    gameState.piece;

  for(
    let y=0;
    y<p.shape.length;
    y++
  ){

    for(
      let x=0;
      x<p.shape[y].length;
      x++
    ){

      if(
        !p.shape[y][x]
      )continue;

      const bx=
        p.x+x;

      const by=
        p.y+y;

      if(
        bx<0 ||
        bx>=8 ||
        by>=16 ||
        (
          by>=0 &&
          gameState.board[by][bx]
        )
      ){

        return true;

      }

    }

  }

  return false;

}

function lockTetris(){

  const p=
    gameState.piece;

  for(
    let y=0;
    y<p.shape.length;
    y++
  ){

    for(
      let x=0;
      x<p.shape[y].length;
      x++
    ){

      if(
        p.shape[y][x]
      ){

        if(
          p.y+y<0
        ){

          endGame(
            "🧩 Игра окончена"
          );

          return;

        }

        gameState.board[
          p.y+y
        ][
          p.x+x
        ]=0x31e6ff;

      }

    }

  }

  for(
    let y=15;
    y>=0;
    y--
  ){

    if(
      gameState.board[y].every(
        Boolean
      )
    ){

      gameState.board.splice(
        y,
        1
      );

      gameState.board.unshift(
        Array(8).fill(0)
      );

      addScore(100);

      y++;

    }

  }

  gameState.piece={
    x:3,
    y:0,
    shape:
      Math.random()<.5
      ?
      [[1,1],[1,1]]
      :
      [[1,1,1,1]]
  };

}

function updateTetris(dt){

  gameState.timer+=dt;

  if(
    gameState.timer<.7
  )return;

  gameState.timer=0;

  gameState.piece.y++;

  if(
    collisionTetris()
  ){

    gameState.piece.y--;

    lockTetris();

  }

  drawTetris();

}


/* =========================================================
   GAME 17 — 2048
========================================================= */

function initNumbers(){

  gameState.board=
    Array.from(
      {length:4},
      ()=>Array(4).fill(0)
    );

  add2048Tile();
  add2048Tile();

  gameState.onMove=(dx,dy)=>{

    if(
      Math.abs(dx)<
      15 &&
      Math.abs(dy)<
      15
    )return;

    let dir;

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      dir=
        dx>0?
        "right":
        "left";

    }else{

      dir=
        dy>0?
        "down":
        "up";

    }

    move2048(dir);

  };

  draw2048();

}

function add2048Tile(){

  const empty=[];

  for(
    let y=0;
    y<4;
    y++
  ){

    for(
      let x=0;
      x<4;
      x++
    ){

      if(
        !gameState.board[y][x]
      ){

        empty.push(
          {x,y}
        );

      }

    }

  }

  if(!empty.length)return;

  const p=
    empty[
      Math.floor(
        Math.random()*
        empty.length
      )
    ];

  gameState.board[p.y][p.x]=
    Math.random()<.9?2:4;

}

function move2048(dir){

  const b=
    gameState.board;

  let moved=false;

  function line(arr){

    let a=
      arr.filter(Boolean);

    for(
      let i=0;
      i<a.length-1;
      i++
    ){

      if(
        a[i]===
        a[i+1]
      ){

        a[i]*=2;

        addScore(
          a[i]
        );

        a.splice(
          i+1,
          1
        );

      }

    }

    while(
      a.length<4
    ){
      a.push(0);
    }

    return a;

  }

  if(
    dir==="left"
  ){

    for(
      let y=0;
      y<4;
      y++
    ){

      const old=[
        ...b[y]
      ];

      b[y]=line(
        b[y]
      );

      if(
        old.join()!==
        b[y].join()
      ){
        moved=true;
      }

    }

  }

  if(
    dir==="right"
  ){

    for(
      let y=0;
      y<4;
      y++
    ){

      const old=[
        ...b[y]
      ];

      b[y]=line(
        [...b[y]].reverse()
      ).reverse();

      if(
        old.join()!==
        b[y].join()
      ){
        moved=true;
      }

    }

  }

  if(
    dir==="up" ||
    dir==="down"
  ){

    for(
      let x=0;
      x<4;
      x++
    ){

      let col=[];

      for(
        let y=0;
        y<4;
        y++
      ){
        col.push(
          b[y][x]
        );
      }

      const old=[
        ...col
      ];

      col=
        line(
          dir==="up"
          ?
          col
          :
          col.reverse()
        );

      if(
        dir==="down"
      ){
        col.reverse();
      }

      for(
        let y=0;
        y<4;
        y++
      ){
        b[y][x]=col[y];
      }

      if(
        old.join()!==
        col.join()
      ){
        moved=true;
      }

    }

  }

  if(moved){

    add2048Tile();
    draw2048();

  }

}

function draw2048(){

  if(
    gameState.numberObjects
  ){

    for(
      const o of
      gameState.numberObjects
    ){
      scene.remove(o);
    }

  }

  gameState.numberObjects=[];

  for(
    let y=0;
    y<4;
    y++
  ){

    for(
      let x=0;
      x<4;
      x++
    ){

      const value=
        gameState.board[y][x];

      if(!value)continue;

      const colors={
        2:0x31e6ff,
        4:0x43f7a1,
        8:0xffd83d,
        16:0xff8b3d,
        32:0xff3d78,
        64:0xff3bd4,
        128:0x8b5cf6,
        256:0xffffff,
        512:0xffd700,
        1024:0xff9d00,
        2048:0xff00dd
      };

      const o=
        cube(
          colors[value]||
          0xffffff,

          x*2.2-3.3,
          y*2.2-3.3,
          0,
          1.8
        );

      gameState.numberObjects.push(
        o
      );

    }

  }

}

/* =========================================================
   MAIN UPDATE
========================================================= */

function update(dt){

  if(
    !running ||
    paused
  )return;

  switch(currentGame){

    case "space":
      updateSpace(dt);
      break;

    case "pong":
      updatePong(dt);
      break;

    case "breakout":
      updateBreakout(dt);
      break;

    case "flappy":
      updateFlappy(dt);
      break;

    case "runner":
      updateRunner(dt);
      break;

    case "reaction":
      updateReaction(dt);
      break;

    case "shooting":
      updateShooting(dt);
      break;

    case "tap":
      updateTap(dt);
      break;

    case "snake":
      updateSnake(dt);
      break;

    case "tetris":
      updateTetris(dt);
      break;

  }

  animateObjects(dt);

}


/* =========================================================
   3D ANIMATION
========================================================= */

function animateObjects(dt){

  if(!scene)return;

  scene.traverse(
    obj=>{

      if(
        obj.userData?.stars
      ){

        const p=
          obj.geometry
            .attributes
            .position;

        for(
          let i=0;
          i<p.count;
          i++
        ){

          let z=
            p.getZ(i)+
            12*dt;

          if(z>20){
            z=-180;
          }

          p.setZ(i,z);

        }

        p.needsUpdate=true;

      }

      if(
        obj.userData?.gameObject
      ){

        obj.rotation.x+=
          dt*.35;

        obj.rotation.y+=
          dt*.55;

      }

    }
  );

}


/* =========================================================
   RENDER LOOP
========================================================= */

let last=performance.now();

function loop(now){

  requestAnimationFrame(
    loop
  );

  const dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  if(renderer){

    renderer.render(
      scene,
      camera
    );

  }

}

requestAnimationFrame(
  loop
);

        };

      if(e.key==="ArrowLeft")
        gameState.dir={
          x:-1,y:0
        };

      if(e.key==="ArrowRight")
        gameState.dir={
          x:1,y:0
        };

    }

    if(
      currentGame==="tetris"
    ){

      if(e.key==="ArrowLeft")
        gameState.piece.x--;

      if(e.key==="ArrowRight")
        gameState.piece.x++;

      if(e.key==="ArrowUp")
        gameState.piece.shape=
          rotate(
            gameState.piece.shape
          );

      if(e.key==="ArrowDown")
        gameState.piece.y++;

    }

  }
);

  try{

    tg?.HapticFeedback
      ?.impactOccurred(

      );

  }catch(e){}

}
