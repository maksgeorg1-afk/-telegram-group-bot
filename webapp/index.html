<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>UA Games</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #080b14;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overscroll-behavior: none;
}

body {
    display: flex;
    justify-content: center;

    touch-action: none;

    position: fixed;
    inset: 0;
}

#app {
    width: 100%;
    max-width: 520px;
    height: 100%;

    position: relative;
    overflow: hidden;

    touch-action: none;
}

.screen {
    width: 100%;
    height: 100%;

    padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom))
        20px;

    display: none;
    flex-direction: column;

    touch-action: none;
}

.screen.active {
    display: flex;
}

.title {
    text-align: center;

    font-size: 32px;
    font-weight: 900;

    margin-top: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

    color: #8f98aa;
    font-size: 15px;

    margin-bottom: 25px;
}

.menu-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

    margin-top: 20px;
}

.game-card {
    border: none;
    border-radius: 24px;

    min-height: 150px;

    color: white;

    font-size: 20px;
    font-weight: 800;

    background:
        linear-gradient(
            145deg,
            #151b2d,
            #0e1320
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06);

    touch-action: manipulation;
}

.game-card:active {
    transform: scale(.96);
}

.game-icon {
    display: block;

    font-size: 55px;

    margin-bottom: 12px;
}

.back {
    margin-top: auto;

    border: none;
    border-radius: 18px;

    min-height: 54px;

    color: white;

    background: #151b2d;

    font-size: 16px;
    font-weight: 700;

    touch-action: manipulation;
}

.header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;

    flex-shrink: 0;
}

.header button {
    border: none;

    background: #151b2d;
    color: white;

    width: 45px;
    height: 45px;

    border-radius: 14px;

    font-size: 20px;

    touch-action: manipulation;
}

.game-name {
    font-size: 24px;
    font-weight: 900;
}

.score {
    text-align: center;

    font-size: 17px;
    font-weight: 800;

    margin-bottom: 10px;

    flex-shrink: 0;
}

/* =====================================================
   ИГРОВЫЕ CANVAS
===================================================== */

#snakeCanvas,
#tetrisCanvas {

    display: block;

    margin: auto;

    background: #0b0f1a;

    border-radius: 22px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.05);

    /*
       КРИТИЧЕСКИ ВАЖНО:
       Telegram не получает свайп как жест закрытия,
       пока палец находится на игровом поле.
    */

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    overscroll-behavior: none;

    flex-shrink: 0;
}

.tip {
    text-align: center;

    color: #7f8899;

    font-size: 13px;

    margin-top: 12px;

    flex-shrink: 0;
}

.bottom-buttons {
    display: flex;

    gap: 10px;

    margin-top: 12px;

    flex-shrink: 0;
}

.bottom-buttons button {
    flex: 1;

    min-height: 52px;

    border: none;
    border-radius: 17px;

    color: white;

    background: #151b2d;

    font-size: 15px;
    font-weight: 800;

    touch-action: manipulation;
}

.bottom-buttons button:active {
    transform: scale(.97);
}

/* =====================================================
   GAME OVER
===================================================== */

.overlay {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: rgba(0,0,0,.7);

    backdrop-filter: blur(8px);

    z-index: 20;

    touch-action: none;
}

.overlay.active {
    display: flex;
}

.modal {

    width: 100%;
    max-width: 350px;

    padding: 30px;

    border-radius: 28px;

    text-align: center;

    background: #111726;

    box-shadow:
        0 25px 70px rgba(0,0,0,.6);
}

.modal-title {

    font-size: 30px;

    font-weight: 900;

    margin-bottom: 10px;
}

.modal-score {

    font-size: 20px;

    margin: 15px 0 25px;

    color: #b6bfd0;
}

.modal button {

    width: 100%;

    min-height: 55px;

    border: none;

    border-radius: 17px;

    color: white;

    background: #247cff;

    font-size: 17px;

    font-weight: 900;

    margin-top: 10px;

    touch-action: manipulation;
}

</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     МЕНЮ
===================================================== -->

<div id="menu" class="screen active">

    <div class="title">
        🎮 ИГРОВОЙ ЦЕНТР
    </div>

    <div class="subtitle">
        Выбирай игру и устанавливай рекорды 🏆
    </div>

    <div class="menu-grid">

        <button
            class="game-card"
            onclick="openSnake()"
        >
            <span class="game-icon">🐍</span>
            ЗМЕЙКА
        </button>

        <button
            class="game-card"
            onclick="openTetris()"
        >
            <span class="game-icon">🧱</span>
            ТЕТРИС
        </button>

    </div>

    <button
        class="back"
        onclick="closeApp()"
    >
        ✕ Закрыть
    </button>

</div>


<!-- =====================================================
     ЗМЕЙКА
===================================================== -->

<div id="snakeScreen" class="screen">

    <div class="header">

        <button onclick="backToMenu()">
            ←
        </button>

        <div class="game-name">
            🐍 ЗМЕЙКА
        </div>

        <button onclick="restartSnake()">
            🔄
        </button>

    </div>

    <div id="snakeScore" class="score">
        🏆 0
    </div>

    <canvas id="snakeCanvas"></canvas>

    <div class="tip">
        👆 Свайпай по полю, чтобы управлять змейкой
    </div>

    <div class="bottom-buttons">

        <button onclick="pauseSnake()">
            ⏸ Пауза
        </button>

        <button onclick="restartSnake()">
            🔄 Новая игра
        </button>

    </div>

</div>


<!-- =====================================================
     ТЕТРИС
===================================================== -->

<div id="tetrisScreen" class="screen">

    <div class="header">

        <button onclick="backToMenu()">
            ←
        </button>

        <div class="game-name">
            🧱 ТЕТРИС
        </div>

        <button onclick="restartTetris()">
            🔄
        </button>

    </div>

    <div id="tetrisScore" class="score">
        🏆 0
    </div>

    <canvas id="tetrisCanvas"></canvas>

    <div class="tip">
        👈👉 веди пальцем — движение · 👆 тап — поворот
    </div>

    <div class="bottom-buttons">

        <button onclick="softDrop()">
            ⬇️ Быстрее
        </button>

        <button onclick="hardDrop()">
            ⏬ Сброс
        </button>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="gameOver" class="overlay">

    <div class="modal">

        <div id="gameOverTitle" class="modal-title">
            💥 ИГРА ОКОНЧЕНА
        </div>

        <div id="gameOverScore" class="modal-score">
            Очки: 0
        </div>

        <button onclick="restartCurrentGame()">
            🔄 Играть снова
        </button>

        <button
            onclick="closeGameOver()"
            style="background:#20283b"
        >
            🎮 Выбрать игру
        </button>

    </div>

</div>

</div>


<script>

/* ======================================================
   TELEGRAM
====================================================== */

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor("#080b14");

        tg.setBackgroundColor("#080b14");

        /*
         * Просим Telegram не реагировать на вертикальные
         * свайпы как на закрытие Mini App.
         */
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }

    } catch(e) {}
}


/* ======================================================
   ЗАПРЕЩАЕМ СИСТЕМНЫЕ TOUCH ЖЕСТЫ
   ВНУТРИ ПРИЛОЖЕНИЯ
====================================================== */

document.addEventListener(
    "touchmove",
    function(e) {

        /*
         * Важно:
         * не позволяем странице прокручиваться.
         */

        if (
            e.target.closest("#snakeCanvas") ||
            e.target.closest("#tetrisCanvas") ||
            e.target.closest("#app")
        ) {

            e.preventDefault();
        }

    },
    {
        passive: false
    }
);


/* ======================================================
   ОБЩЕЕ
====================================================== */

let currentGame = "";

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");
}


function closeApp() {

    if (tg) {

        try {
            tg.close();
        } catch(e) {}

    }
}


function backToMenu() {

    snakeRunning = false;
    tetrisRunning = false;

    clearTimeout(snakeTimer);
    clearTimeout(tetrisTimer);

    document
        .getElementById("gameOver")
        .classList.remove("active");

    showScreen("menu");
}


/* ======================================================
   ЗМЕЙКА
====================================================== */

const snakeCanvas =
    document.getElementById("snakeCanvas");

const snakeCtx =
    snakeCanvas.getContext("2d");

const SW = 16;
const SH = 20;

let snake = [];
let food = null;

let snakeDirection = {
    x: 1,
    y: 0
};

let snakeNextDirection = {
    x: 1,
    y: 0
};

let snakeScore = 0;

let snakeRunning = false;
let snakePaused = false;

let snakeTimer = null;

let snakeTouchStartX = 0;
let snakeTouchStartY = 0;


function setupSnakeCanvas() {

    const size =
        Math.min(
            window.innerWidth - 40,
            390
        );

    snakeCanvas.width = size;

    snakeCanvas.height =
        Math.floor(
            size * SH / SW
        );
}


function openSnake() {

    currentGame = "snake";

    showScreen("snakeScreen");

    setupSnakeCanvas();

    restartSnake();
}


function restartSnake() {

    clearTimeout(snakeTimer);

    snake = [

        {
            x: 7,
            y: 10
        },

        {
            x: 6,
            y: 10
        },

        {
            x: 5,
            y: 10
        }

    ];

    snakeDirection = {
        x: 1,
        y: 0
    };

    snakeNextDirection = {
        x: 1,
        y: 0
    };

    snakeScore = 0;

    snakePaused = false;

    snakeRunning = true;

    createFood();

    updateSnakeScore();

    drawSnake();

    snakeLoop();
}


function createFood() {

    let valid = false;

    while (!valid) {

        food = {

            x:
                Math.floor(
                    Math.random() * SW
                ),

            y:
                Math.floor(
                    Math.random() * SH
                )
        };

        valid =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );
    }
}


function updateSnakeScore() {

    document
        .getElementById("snakeScore")
        .textContent =
        "🏆 " + snakeScore;
}


function drawSnake() {

    const cellW =
        snakeCanvas.width / SW;

    const cellH =
        snakeCanvas.height / SH;

    snakeCtx.clearRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );

    snakeCtx.fillStyle =
        "#0b0f1a";

    snakeCtx.fillRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );


    /* Сетка */

    snakeCtx.strokeStyle =
        "rgba(255,255,255,.025)";

    snakeCtx.lineWidth = 1;

    for (
        let x = 0;
        x <= SW;
        x++
    ) {

        snakeCtx.beginPath();

        snakeCtx.moveTo(
            x * cellW,
            0
        );

        snakeCtx.lineTo(
            x * cellW,
            snakeCanvas.height
        );

        snakeCtx.stroke();
    }


    for (
        let y = 0;
        y <= SH;
        y++
    ) {

        snakeCtx.beginPath();

        snakeCtx.moveTo(
            0,
            y * cellH
        );

        snakeCtx.lineTo(
            snakeCanvas.width,
            y * cellH
        );

        snakeCtx.stroke();
    }


    /* Еда */

    if (food) {

        snakeCtx.fillStyle =
            "#ff3b30";

        snakeCtx.beginPath();

        snakeCtx.arc(

            food.x * cellW +
                cellW / 2,

            food.y * cellH +
                cellH / 2,

            Math.min(cellW, cellH) * .36,

            0,
            Math.PI * 2

        );

        snakeCtx.fill();
    }


    /* Змейка */

    snake.forEach(
        (part, index) => {

            const padding = 2;

            const x =
                part.x * cellW +
                padding;

            const y =
                part.y * cellH +
                padding;

            const w =
                cellW -
                padding * 2;

            const h =
                cellH -
                padding * 2;

            snakeCtx.fillStyle =
                index === 0
                    ? "#65ff7a"
                    : "#20c957";

            snakeCtx.beginPath();

            snakeCtx.roundRect(
                x,
                y,
                w,
                h,
                Math.min(6, w / 3)
            );

            snakeCtx.fill();


            /* глаза */

            if (index === 0) {

                snakeCtx.fillStyle =
                    "#07100a";

                const eyeSize =
                    Math.max(
                        2,
                        cellW * .11
                    );

                let eyeX;
                let eyeY1;
                let eyeY2;


                if (
                    snakeDirection.x > 0
                ) {

                    eyeX =
                        x + w * .68;

                    eyeY1 =
                        y + h * .32;

                    eyeY2 =
                        y + h * .68;

                } else if (
                    snakeDirection.x < 0
                ) {

                    eyeX =
                        x + w * .32;

                    eyeY1 =
                        y + h * .32;

                    eyeY2 =
                        y + h * .68;

                } else if (
                    snakeDirection.y < 0
                ) {

                    eyeX =
                        x + w * .32;

                    eyeY1 =
                        y + h * .32;

                    eyeY2 =
                        x + w * .68;

                } else {

                    eyeX =
                        x + w * .32;

                    eyeY1 =
                        y + h * .68;

                    eyeY2 =
                        y + h * .68;
                }


                snakeCtx.beginPath();

                snakeCtx.arc(
                    eyeX,
                    eyeY1,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                snakeCtx.fill();


                snakeCtx.beginPath();

                snakeCtx.arc(
                    eyeX,
                    eyeY2,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                snakeCtx.fill();
            }

        }
    );
}


function snakeLoop() {

    if (!snakeRunning) {
        return;
    }

    snakeTimer =
        setTimeout(
            () => {

                if (!snakePaused) {

                    snakeDirection = {
                        ...snakeNextDirection
                    };

                    const head =
                        snake[0];

                    const newHead = {

                        x:
                            head.x +
                            snakeDirection.x,

                        y:
                            head.y +
                            snakeDirection.y
                    };


                    /* Стена */

                    if (

                        newHead.x < 0 ||

                        newHead.x >= SW ||

                        newHead.y < 0 ||

                        newHead.y >= SH

                    ) {

                        snakeGameOver();

                        return;
                    }


                    const eating =
                        food &&
                        newHead.x === food.x &&
                        newHead.y === food.y;


                    const bodyToCheck =
                        eating
                            ? snake
                            : snake.slice(
                                0,
                                snake.length - 1
                            );


                    /* Тело */

                    if (
                        bodyToCheck.some(
                            part =>
                                part.x === newHead.x &&
                                part.y === newHead.y
                        )
                    ) {

                        snakeGameOver();

                        return;
                    }


                    snake.unshift(
                        newHead
                    );


                    if (eating) {

                        snakeScore += 10;

                        updateSnakeScore();

                        createFood();

                        haptic();

                    } else {

                        snake.pop();
                    }

                    drawSnake();
                }

                snakeLoop();

            },

            Math.max(
                65,
                135 -
                Math.min(
                    55,
                    snakeScore * .35
                )
            )
        );
}


function snakeGameOver() {

    snakeRunning = false;

    clearTimeout(snakeTimer);

    showGameOver(
        "🐍 ЗМЕЙКА ОКОНЧЕНА",
        snakeScore
    );
}


function pauseSnake() {

    snakePaused =
        !snakePaused;

    const button =
        document.querySelector(
            "#snakeScreen .bottom-buttons button"
        );

    if (button) {

        button.textContent =
            snakePaused
                ? "▶️ Продолжить"
                : "⏸ Пауза";
    }
}


/* ======================================================
   УПРАВЛЕНИЕ ЗМЕЙКОЙ
====================================================== */

snakeCanvas.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        const touch =
            e.changedTouches[0];

        snakeTouchStartX =
            touch.clientX;

        snakeTouchStartY =
            touch.clientY;

    },
    {
        passive: false
    }
);


snakeCanvas.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        const touch =
            e.changedTouches[0];

        const dx =
            touch.clientX -
            snakeTouchStartX;

        const dy =
            touch.clientY -
            snakeTouchStartY;

        const minSwipe = 18;

        if (
            Math.abs(dx) < minSwipe &&
            Math.abs(dy) < minSwipe
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            changeSnakeDirection(
                dx > 0 ? 1 : -1,
                0
            );

        } else {

            changeSnakeDirection(
                0,
                dy > 0 ? 1 : -1
            );
        }

    },
    {
        passive: false
    }
);


/* ======================================================
   ТЕТРИС
====================================================== */

const tetrisCanvas =
    document.getElementById("tetrisCanvas");

const tetrisCtx =
    tetrisCanvas.getContext("2d");


const TW = 10;
const TH = 18;

let tetrisBoard = [];
let currentPiece = null;

let tetrisScore = 0;

let tetrisRunning = false;

let tetrisTimer = null;


/* управление */

let tetrisTouchStartX = 0;
let tetrisTouchStartY = 0;

let tetrisLastX = 0;

let tetrisDragging = false;

let tetrisMoveAccumulator = 0;


/* ======================================================
   ФИГУРЫ
====================================================== */

const pieces = [

    {
        shape: [
            [1,1,1,1]
        ]
    },

    {
        shape: [
            [1,1],
            [1,1]
        ]
    },

    {
        shape: [
            [0,1,0],
            [1,1,1]
        ]
    },

    {
        shape: [
            [1,0,0],
            [1,1,1]
        ]
    },

    {
        shape: [
            [0,0,1],
            [1,1,1]
        ]
    },

    {
        shape: [
            [0,1,1],
            [1,1,0]
        ]
    },

    {
        shape: [
            [1,1,0],
            [0,1,1]
        ]
    }

];


/* ======================================================
   ЦВЕТА ФИГУР
====================================================== */

const pieceColors = [

    "#29b6f6",
    "#ffd740",
    "#ab47bc",
    "#42a5f5",
    "#ff7043",
    "#66bb6a",
    "#ef5350"

];


/* ======================================================
   CANVAS
====================================================== */

function setupTetrisCanvas() {

    const size =
        Math.min(
            window.innerWidth - 40,
            390
        );

    tetrisCanvas.width =
        size;

    tetrisCanvas.height =
        Math.floor(
            size * TH / TW
        );
}


function createTetrisBoard() {

    return Array.from(
        {
            length: TH
        },
        () =>
            Array(TW).fill(null)
    );
}


function openTetris() {

    currentGame = "tetris";

    showScreen("tetrisScreen");

    setupTetrisCanvas();

    restartTetris();
}


function restartTetris() {

    clearTimeout(tetrisTimer);

    tetrisBoard =
        createTetrisBoard();

    tetrisScore = 0;

    tetrisRunning = true;

    updateTetrisScore();

    spawnPiece();

    drawTetris();

    tetrisLoop();
}


/* ======================================================
   СОЗДАНИЕ ФИГУРЫ
====================================================== */

function spawnPiece() {

    const index =
        Math.floor(
            Math.random() *
            pieces.length
        );

    const template =
        pieces[index];

    currentPiece = {

        shape:
            template.shape.map(
                row => row.slice()
            ),

        color:
            pieceColors[index],

        x:
            Math.floor(
                (
                    TW -
                    template.shape[0].length
                ) / 2
            ),

        y: 0
    };


    if (
        !validTetrisMove(
            0,
            0,
            currentPiece.shape
        )
    ) {

        tetrisGameOver();
    }
}


/* ======================================================
   ПРОВЕРКА ДВИЖЕНИЯ
====================================================== */

function validTetrisMove(
    dx,
    dy,
    shape
) {

    for (
        let y = 0;
        y < shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < shape[y].length;
            x++
        ) {

            if (!shape[y][x]) {
                continue;
            }

            const nx =
                currentPiece.x +
                x +
                dx;

            const ny =
                currentPiece.y +
                y +
                dy;


            if (
                nx < 0 ||
                nx >= TW ||
                ny >= TH
            ) {

                return false;
            }


            if (
                ny >= 0 &&
                tetrisBoard[ny][nx]
            ) {

                return false;
            }
        }
    }

    return true;
}


/* ======================================================
   ПОВОРОТ
====================================================== */

function rotateShape(shape) {

    const rows =
        shape.length;

    const cols =
        shape[0].length;

    const result =
        Array.from(
            {
                length: cols
            },
            () =>
                Array(rows).fill(0)
        );

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            result[x][
                rows - 1 - y
            ] =
                shape[y][x];
        }
    }

    return result;
}


function rotateTetris() {

    if (
        !tetrisRunning ||
        !currentPiece
    ) {
        return;
    }

    const rotated =
        rotateShape(
            currentPiece.shape
        );


    /* обычный поворот */

    if (
        validTetrisMove(
            0,
            0,
            rotated
        )
    ) {

        currentPiece.shape =
            rotated;

        drawTetris();

        haptic();

        return;
    }


    /* небольшой wall kick */

    if (
        validTetrisMove(
            -1,
            0,
            rotated
        )
    ) {

        currentPiece.x--;

        currentPiece.shape =
            rotated;

        drawTetris();

        haptic();

        return;
    }


    if (
        validTetrisMove(
            1,
            0,
            rotated
        )
    ) {

        currentPiece.x++;

        currentPiece.shape =
            rotated;

        drawTetris();

        haptic();
    }
}


/* ======================================================
   ДВИЖЕНИЕ
====================================================== */

function moveTetris(dx) {

    if (
        !tetrisRunning ||
        !currentPiece
    ) {
        return;
    }

    if (
        validTetrisMove(
            dx,
            0,
            currentPiece.shape
        )
    ) {

        currentPiece.x += dx;

        drawTetris();
    }
}


/* ======================================================
   МЯГКОЕ ПАДЕНИЕ
====================================================== */

function softDrop() {

    if (
        !tetrisRunning ||
        !currentPiece
    ) {
        return;
    }

    if (
        validTetrisMove(
            0,
            1,
            currentPiece.shape
        )
    ) {

        currentPiece.y++;

        tetrisScore++;

        updateTetrisScore();

        drawTetris();

    } else {

        lockPiece();
    }
}


/* ======================================================
   HARD DROP
====================================================== */

function hardDrop() {

    if (
        !tetrisRunning ||
        !currentPiece
    ) {
        return;
    }

    let distance = 0;

    while (
        validTetrisMove(
            0,
            1,
            currentPiece.shape
        )
    ) {

        currentPiece.y++;

        distance++;
    }

    tetrisScore +=
        distance * 2;

    updateTetrisScore();

    lockPiece();

    haptic();
}


/* ======================================================
   ЗАФИКСИРОВАТЬ ФИГУРУ
====================================================== */

function lockPiece() {

    if (!currentPiece) {
        return;
    }

    const shape =
        currentPiece.shape;

    for (
        let y = 0;
        y < shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < shape[y].length;
            x++
        ) {

            if (!shape[y][x]) {
                continue;
            }

            const bx =
                currentPiece.x + x;

            const by =
                currentPiece.y + y;


            if (
                by >= 0 &&
                by < TH &&
                bx >= 0 &&
                bx < TW
            ) {

                tetrisBoard[by][bx] =
                    currentPiece.color;
            }
        }
    }

    clearLines();

    spawnPiece();

    drawTetris();
}


/* ======================================================
   ЛИНИИ
====================================================== */

function clearLines() {

    let lines = 0;

    tetrisBoard =
        tetrisBoard.filter(
            row => {

                if (
                    row.every(
                        cell =>
                            cell !== null
                    )
                ) {

                    lines++;

                    return false;
                }

                return true;
            }
        );


    while (
        tetrisBoard.length < TH
    ) {

        tetrisBoard.unshift(
            Array(TW).fill(null)
        );
    }


    if (lines === 1) {
        tetrisScore += 100;
    }

    if (lines === 2) {
        tetrisScore += 300;
    }

    if (lines === 3) {
        tetrisScore += 600;
    }

    if (lines >= 4) {
        tetrisScore += 1000;
    }


    if (lines > 0) {

        updateTetrisScore();

        haptic();
    }
}


function updateTetrisScore() {

    document
        .getElementById("tetrisScore")
        .textContent =
        "🏆 " + tetrisScore;
}


/* ======================================================
   ОТРИСОВКА ТЕТРИСА
====================================================== */

function drawTetris() {

    const cellW =
        tetrisCanvas.width / TW;

    const cellH =
        tetrisCanvas.height / TH;


    tetrisCtx.clearRect(
        0,
        0,
        tetrisCanvas.width,
        tetrisCanvas.height
    );


    tetrisCtx.fillStyle =
        "#0b0f1a";

    tetrisCtx.fillRect(
        0,
        0,
        tetrisCanvas.width,
        tetrisCanvas.height
    );


    /* Сетка */

    tetrisCtx.strokeStyle =
        "rgba(255,255,255,.035)";

    tetrisCtx.lineWidth = 1;


    for (
        let x = 0;
        x <= TW;
        x++
    ) {

        tetrisCtx.beginPath();

        tetrisCtx.moveTo(
            x * cellW,
            0
        );

        tetrisCtx.lineTo(
            x * cellW,
            tetrisCanvas.height
        );

        tetrisCtx.stroke();
    }


    for (
        let y = 0;
        y <= TH;
        y++
    ) {

        tetrisCtx.beginPath();

        tetrisCtx.moveTo(
            0,
            y * cellH
        );

        tetrisCtx.lineTo(
            tetrisCanvas.width,
            y * cellH
        );

        tetrisCtx.stroke();
    }


    /* Сохранённые блоки */

    for (
        let y = 0;
        y < TH;
        y++
    ) {

        for (
            let x = 0;
            x < TW;
            x++
        ) {

            if (
                tetrisBoard[y][x]
            ) {

                drawBlock(
                    x,
                    y,
                    tetrisBoard[y][x]
                );
            }
        }
    }


    /* Текущая фигура */

    if (currentPiece) {

        const shape =
            currentPiece.shape;

        for (
            let y = 0;
            y < shape.length;
            y++
        ) {

            for (
                let x = 0;
                x < shape[y].length;
                x++
            ) {

                if (!shape[y][x]) {
                    continue;
                }

                drawBlock(
                    currentPiece.x + x,
                    currentPiece.y + y,
                    currentPiece.color
                );
            }
        }
    }
}


/* ======================================================
   РИСОВАНИЕ БЛОКА
====================================================== */

function drawBlock(
    x,
    y,
    color
) {

    if (
        x < 0 ||
        x >= TW ||
        y < 0 ||
        y >= TH
    ) {
        return;
    }

    const cellW =
        tetrisCanvas.width / TW;

    const cellH =
        tetrisCanvas.height / TH;

    const padding = 1.5;

    const px =
        x * cellW +
        padding;

    const py =
        y * cellH +
        padding;

    const w =
        cellW -
        padding * 2;

    const h =
        cellH -
        padding * 2;


    /* основной блок */

    tetrisCtx.fillStyle =
        color;

    tetrisCtx.beginPath();

    tetrisCtx.roundRect(
        px,
        py,
        w,
        h,
        Math.min(
            5,
            w * .2
        )
    );

    tetrisCtx.fill();


    /* блик */

    tetrisCtx.fillStyle =
        "rgba(255,255,255,.20)";

    tetrisCtx.beginPath();

    tetrisCtx.roundRect(
        px + w * .12,
        py + h * .10,
        w * .76,
        h * .18,
        3
    );

    tetrisCtx.fill();
}


/* ======================================================
   ЦИКЛ ТЕТРИСА
====================================================== */

function tetrisLoop() {

    if (!tetrisRunning) {
        return;
    }


    const level =
        Math.floor(
            tetrisScore / 500
        );


    const speed =
        Math.max(
            90,
            650 -
            level * 45
        );


    tetrisTimer =
        setTimeout(
            () => {

                if (
                    !tetrisRunning
                ) {
                    return;
                }


                if (
                    validTetrisMove(
                        0,
                        1,
                        currentPiece.shape
                    )
                ) {

                    currentPiece.y++;

                } else {

                    lockPiece();
                }


                drawTetris();

                tetrisLoop();

            },
            speed
        );
}


/* ======================================================
   GAME OVER
====================================================== */

function tetrisGameOver() {

    tetrisRunning = false;

    clearTimeout(tetrisTimer);

    showGameOver(
        "🧱 ТЕТРИС ОКОНЧЕН",
        tetrisScore
    );
}


function showGameOver(
    title,
    score
) {

    document
        .getElementById("gameOverTitle")
        .textContent =
        title;

    document
        .getElementById("gameOverScore")
        .textContent =
        "🏆 Очки: " + score;

    document
        .getElementById("gameOver")
        .classList.add("active");
}


function closeGameOver() {

    document
        .getElementById("gameOver")
        .classList.remove("active");

    showScreen("menu");
}


function restartCurrentGame() {

    document
        .getElementById("gameOver")
        .classList.remove("active");

    if (
        currentGame === "snake"
    ) {

        showScreen(
            "snakeScreen"
        );

        restartSnake();

    } else {

        showScreen(
            "tetrisScreen"
        );

        restartTetris();
    }
}


/* ======================================================
   HAPTIC
====================================================== */

function haptic() {

    if (!tg) {
        return;
    }

    try {

        tg.HapticFeedback
            .impactOccurred(
                "light"
            );

    } catch(e) {}
}


/* ======================================================
   УЛУЧШЕННОЕ УПРАВЛЕНИЕ ТЕТРИСОМ
====================================================== */

/*
   Теперь фигура начинает двигаться прямо во время
   движения пальца, а не ждёт touchend.
*/

tetrisCanvas.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        const touch =
            e.changedTouches[0];

        tetrisTouchStartX =
            touch.clientX;

        tetrisTouchStartY =
            touch.clientY;

        tetrisLastX =
            touch.clientX;

        tetrisDragging = true;

        tetrisMoveAccumulator = 0;

    },
    {
        passive: false
    }
);


tetrisCanvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

        if (
            !tetrisDragging ||
            !tetrisRunning
        ) {
            return;
        }


        const touch =
            e.changedTouches[0];

        const currentX =
            touch.clientX;

        const dx =
            currentX -
            tetrisLastX;


        /*
         * Движение на примерно половину клетки
         * уже двигает фигуру.
         */

        tetrisMoveAccumulator += dx;

        const cellW =
            tetrisCanvas.width / TW;


        while (
            tetrisMoveAccumulator >
            cellW * .45
        ) {

            moveTetris(1);

            tetrisMoveAccumulator -=
                cellW * .45;
        }


        while (
            tetrisMoveAccumulator <
            -cellW * .45
        ) {

            moveTetris(-1);

            tetrisMoveAccumulator +=
                cellW * .45;
        }


        tetrisLastX =
            currentX;


        /*
         * Вертикальное движение вниз:
         * слегка ускоряем падение.
         */

        const dy =
            touch.clientY -
            tetrisTouchStartY;


        if (
            dy > 35
        ) {

            softDrop();
        }

    },
    {
        passive: false
    }
);


tetrisCanvas.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        if (!tetrisDragging) {
            return;
        }

        tetrisDragging = false;


        const touch =
            e.changedTouches[0];

        const dx =
            touch.clientX -
            tetrisTouchStartX;

        const dy =
            touch.clientY -
            tetrisTouchStartY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
         * Если палец практически не двигался —
         * это TAP, значит поворот.
         */

        if (
            distance < 18
        ) {

            rotateTetris();

            return;
        }


        /*
         * Сильный свайп вниз —
         * hard drop.
         */

        if (
            dy > 80 &&
            Math.abs(dy) >
            Math.abs(dx)
        ) {

            hardDrop();

            return;
        }


        /*
         * Сильный свайп вверх —
         * поворот.
         */

        if (
            dy < -60 &&
            Math.abs(dy) >
            Math.abs(dx)
        ) {

            rotateTetris();
        }

    },
    {
        passive: false
    }
);


/* ======================================================
   ЗМЕЙКА — БЛОКИРУЕМ СКРОЛЛ
====================================================== */

snakeCanvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(
    "resize",
    () => {

        const active =
            document.querySelector(
                ".screen.active"
            );


        if (
            active &&
            active.id ===
            "snakeScreen"
        ) {

            setupSnakeCanvas();

            drawSnake();
        }


        if (
            active &&
            active.id ===
            "tetrisScreen"
        ) {

            setupTetrisCanvas();

            drawTetris();
        }

    }
);

</script>
