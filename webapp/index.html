<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>UA Games</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b16;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    user-select:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:520px;
    height:100%;
    min-height:100%;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 0%,#26366e 0%,transparent 40%),
        linear-gradient(180deg,#0b1022,#070914);
}

.header{
    padding:15px 4px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.score{
    background:#151b32;
    border:1px solid #303b68;
    border-radius:15px;
    padding:8px 13px;
    font-weight:800;
}

.screen{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.menu{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.title{
    text-align:center;
    font-size:38px;
    font-weight:1000;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#9da8ca;
    margin-bottom:15px;
}

.game-btn{
    border:0;
    border-radius:22px;
    padding:19px;
    color:white;
    font-size:22px;
    font-weight:900;
    background:linear-gradient(135deg,#1e2b55,#151b35);
    box-shadow:0 8px 25px #0006;
    border:1px solid #34416f;
}

.game-btn:active{
    transform:scale(.96);
}

.hidden{
    display:none!important;
}

.board-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

#snakeBoard{
    width:min(92vw,430px);
    aspect-ratio:10/12;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:2px;
    padding:5px;
    border-radius:18px;
    background:#12182c;
    border:2px solid #303b67;
    box-shadow:0 15px 40px #0008;
}

.cell{
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:4px;
    font-size:clamp(14px,5vw,26px);
    background:#0b1020;
}

.snake{
    background:#193b2a;
}

.food{
    animation:pulse .55s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(.75)}
    to{transform:scale(1)}
}

#tetrisBoard{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    width:min(92vw,390px);
    aspect-ratio:10/16;
    gap:1px;
    padding:5px;
    background:#11172b;
    border:2px solid #303b67;
    border-radius:18px;
    box-shadow:0 15px 40px #0008;
}

.tcell{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:3px;
    font-size:clamp(12px,4.5vw,24px);
    background:#090e1c;
}

.info{
    display:flex;
    justify-content:space-between;
    width:min(92vw,390px);
    margin-bottom:8px;
    color:#aeb9dc;
    font-weight:800;
}

.controls-info{
    text-align:center;
    color:#8d99bd;
    margin-top:10px;
    font-size:13px;
}

.back{
    margin-top:12px;
    width:min(92vw,390px);
    border:0;
    border-radius:16px;
    padding:12px;
    background:#171e37;
    color:white;
    font-size:16px;
    font-weight:800;
}

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.modal-box{
    width:calc(100% - 40px);
    max-width:400px;
    background:#11172b;
    border:1px solid #394574;
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 70px #000;
}

.modal-title{
    font-size:28px;
    font-weight:1000;
    margin-bottom:8px;
}

.modal-score{
    font-size:42px;
    font-weight:1000;
    margin:15px 0;
}

.modal button{
    width:100%;
    border:0;
    border-radius:17px;
    padding:15px;
    background:#315cff;
    color:white;
    font-size:18px;
    font-weight:900;
}

.swipe-area{
    touch-action:none;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🎮 UA GAMES</div>
        <div class="score" id="topScore">🏆 0</div>
    </div>

    <div class="screen">

        <!-- МЕНЮ -->
        <div id="menu" class="menu">
            <div class="title">🎮 ИГРЫ</div>

            <div class="subtitle">
                Играй прямо на телефоне 👆<br>
                Управление свайпами
            </div>

            <button class="game-btn" onclick="startSnake()">
                🐍 ЗМЕЙКА
            </button>

            <button class="game-btn" onclick="startTetris()">
                🧱 ТЕТРИС
            </button>
        </div>


        <!-- ЗМЕЙКА -->
        <div id="snakeGame" class="hidden swipe-area">

            <div class="info">
                <span>🐍 ЗМЕЙКА</span>
                <span id="snakeScore">🏆 0</span>
            </div>

            <div class="board-wrap">
                <div id="snakeBoard"></div>
            </div>

            <div class="controls-info">
                👆 Свайп в любую сторону для управления
            </div>

            <button class="back" onclick="showMenu()">
                🎮 Вернуться в игры
            </button>

        </div>


        <!-- ТЕТРИС -->
        <div id="tetrisGame" class="hidden swipe-area">

            <div class="info">
                <span>🧱 ТЕТРИС</span>
                <span id="tetrisScore">🏆 0</span>
            </div>

            <div class="board-wrap">
                <div id="tetrisBoard"></div>
            </div>

            <div class="controls-info">
                👈👉 движение • 👆 свайп вниз — ускорение<br>
                🔄 тап — поворот • ⬇️ длинный свайп вниз — сброс
            </div>

            <button class="back" onclick="showMenu()">
                🎮 Вернуться в игры
            </button>

        </div>

    </div>

</div>


<div id="modal" class="modal hidden">
    <div class="modal-box">

        <div class="modal-title" id="modalTitle">
            💥 ИГРА ОКОНЧЕНА
        </div>

        <div id="modalText">
            Твой результат:
        </div>

        <div class="modal-score" id="modalScore">
            0
        </div>

        <button onclick="closeModal()">
            🔄 Играть снова
        </button>

    </div>
</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}


/* =====================================================
   ОБЩЕЕ
===================================================== */

let currentGame=null;

function hideAll(){

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("snakeGame").classList.add("hidden");
    document.getElementById("tetrisGame").classList.add("hidden");
}

function showMenu(){

    stopSnake();
    stopTetris();

    hideAll();

    document.getElementById("menu").classList.remove("hidden");

    document.getElementById("topScore").textContent="🏆 0";

    currentGame=null;
}

function setTopScore(score){

    document.getElementById("topScore").textContent="🏆 "+score;
}

function gameOver(title,score){

    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalScore").textContent=score;
    document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){

    document.getElementById("modal").classList.add("hidden");

    if(currentGame==="snake"){
        startSnake();
    }

    if(currentGame==="tetris"){
        startTetris();
    }
}


/* =====================================================
   СВАЙПЫ
===================================================== */

let touchStartX=0;
let touchStartY=0;
let touchStartTime=0;

function setupSwipe(element,callback){

    element.addEventListener("touchstart",function(e){

        const t=e.changedTouches[0];

        touchStartX=t.clientX;
        touchStartY=t.clientY;
        touchStartTime=Date.now();

    },{passive:true});


    element.addEventListener("touchend",function(e){

        const t=e.changedTouches[0];

        const dx=t.clientX-touchStartX;
        const dy=t.clientY-touchStartY;

        const distance=Math.max(
            Math.abs(dx),
            Math.abs(dy)
        );

        const duration=Date.now()-touchStartTime;

        if(distance<25){

            callback("tap");

            return;
        }

        if(Math.abs(dx)>Math.abs(dy)){

            callback(dx>0?"right":"left");

        }else{

            callback(dy>0?"down":"up");

        }

    },{passive:true});
}


/* =====================================================
   ЗМЕЙКА
===================================================== */

const SW=10;
const SH=12;

let snake=[];
let food=null;
let snakeDir={x:1,y:0};
let snakeNext={x:1,y:0};
let snakeScore=0;
let snakeTimer=null;
let snakeRunning=false;

function startSnake(){

    closeGameLoops();

    currentGame="snake";

    hideAll();

    document.getElementById("snakeGame").classList.remove("hidden");

    snake=[
        {x:5,y:6},
        {x:4,y:6},
        {x:3,y:6}
    ];

    snakeDir={x:1,y:0};
    snakeNext={x:1,y:0};
    snakeScore=0;
    snakeRunning=true;

    createFood();

    renderSnake();

    setTopScore(0);

    snakeTimer=setInterval(
        snakeStep,
        430
    );
}


function createFood(){

    let free=[];

    for(let y=0;y<SH;y++){

        for(let x=0;x<SW;x++){

            let occupied=snake.some(
                s=>s.x===x&&s.y===y
            );

            if(!occupied){
                free.push({x,y});
            }
        }
    }

    food=free[
        Math.floor(
            Math.random()*free.length
        )
    ];
}


function renderSnake(){

    const board=document.getElementById(
        "snakeBoard"
    );

    board.innerHTML="";

    for(let y=0;y<SH;y++){

        for(let x=0;x<SW;x++){

            const cell=document.createElement("div");

            cell.className="cell";

            const segment=snake.findIndex(
                s=>s.x===x&&s.y===y
            );

            if(segment===0){

                cell.textContent="🐲";
                cell.classList.add("snake");

            }else if(segment>0){

                cell.textContent=
                    segment%2===0?"🟢":"🟩";

                cell.classList.add("snake");

            }else if(
                food &&
                food.x===x &&
                food.y===y
            ){

                cell.textContent="🍎";
                cell.classList.add("food");

            }else{

                const decorations=[
                    "",
                    "",
                    "✨",
                    "",
                    "",
                    "⭐",
                    "",
                    "💫"
                ];

                cell.textContent=
                    decorations[
                        Math.floor(
                            Math.random()*
                            decorations.length
                        )
                    ];
            }

            board.appendChild(cell);
        }
    }

    document.getElementById(
        "snakeScore"
    ).textContent="🏆 "+snakeScore;
}


function snakeStep(){

    if(!snakeRunning)return;

    snakeDir=snakeNext;

    const head=snake[0];

    const next={
        x:head.x+snakeDir.x,
        y:head.y+snakeDir.y
    };

    if(
        next.x<0 ||
        next.x>=SW ||
        next.y<0 ||
        next.y>=SH
    ){

        endSnake();

        return;
    }

    const hit=snake.some(
        (s,i)=>
            i>0 &&
            s.x===next.x &&
            s.y===next.y
    );

    if(hit){

        endSnake();

        return;
    }

    snake.unshift(next);

    if(
        food &&
        next.x===food.x &&
        next.y===food.y
    ){

        snakeScore+=10;

        createFood();

    }else{

        snake.pop();
    }

    setTopScore(snakeScore);

    renderSnake();
}


function endSnake(){

    snakeRunning=false;

    clearInterval(snakeTimer);

    gameOver(
        "💥 ЗМЕЙКА ОКОНЧЕНА",
        snakeScore
    );
}


function stopSnake(){

    snakeRunning=false;

    clearInterval(snakeTimer);

    snakeTimer=null;
}


function snakeSwipe(direction){

    if(!snakeRunning)return;

    const directions={

        up:{x:0,y:-1},
        down:{x:0,y:1},
        left:{x:-1,y:0},
        right:{x:1,y:0}

    };

    const newDir=directions[direction];

    if(!newDir)return;

    if(
        newDir.x===-snakeDir.x &&
        newDir.y===-snakeDir.y
    ){
        return;
    }

    snakeNext=newDir;
}


setupSwipe(
    document.getElementById("snakeGame"),
    snakeSwipe
);


/* =====================================================
   ТЕТРИС
===================================================== */

const TW=10;
const TH=18;

const PIECES=[

    {
        emoji:"🟥",
        cells:[
            [0,0],
            [1,0],
            [2,0],
            [3,0]
        ]
    },

    {
        emoji:"🟨",
        cells:[
            [0,0],
            [1,0],
            [0,1],
            [1,1]
        ]
    },

    {
        emoji:"🟪",
        cells:[
            [1,0],
            [0,1],
            [1,1],
            [2,1]
        ]
    },

    {
        emoji:"🟩",
        cells:[
            [1,0],
            [2,0],
            [0,1],
            [1,1]
        ]
    },

    {
        emoji:"🟦",
        cells:[
            [0,0],
            [1,0],
            [1,1],
            [2,1]
        ]
    },

    {
        emoji:"🟧",
        cells:[
            [0,0],
            [0,1],
            [1,1],
            [2,1]
        ]
    },

    {
        emoji:"🔵",
        cells:[
            [0,1],
            [1,0],
            [1,1],
            [2,1]
        ]
    }

];

let tBoard=[];
let tPiece=null;
let tScore=0;
let tTimer=null;
let tRunning=false;


function emptyTetrisBoard(){

    return Array.from(
        {length:TH},
        ()=>Array(TW).fill(null)
    );
}


function randomPiece(){

    const source=
        PIECES[
            Math.floor(
                Math.random()*PIECES.length
            )
        ];

    return {

        emoji:source.emoji,

        cells:source.cells.map(
            c=>[c[0],c[1]]
        ),

        x:3,
        y:0

    };
}


function startTetris(){

    closeGameLoops();

    currentGame="tetris";

    hideAll();

    document.getElementById(
        "tetrisGame"
    ).classList.remove("hidden");

    tBoard=emptyTetrisBoard();

    tScore=0;

    tRunning=true;

    tPiece=randomPiece();

    renderTetris();

    setTopScore(0);

    tTimer=setInterval(
        tetrisStep,
        650
    );
}


function rotatedCells(piece){

    const cells=piece.cells;

    const rotated=cells.map(
        ([x,y])=>[-y,x]
    );

    const minX=Math.min(
        ...rotated.map(c=>c[0])
    );

    const minY=Math.min(
        ...rotated.map(c=>c[1])
    );

    return rotated.map(
        ([x,y])=>[
            x-minX,
            y-minY
        ]
    );
}


function canMove(
    dx,
    dy,
    cells=tPiece.cells
){

    for(const [px,py] of cells){

        const x=
            tPiece.x+
            px+
            dx;

        const y=
            tPiece.y+
            py+
            dy;

        if(
            x<0 ||
            x>=TW ||
            y>=TH
        ){
            return false;
        }

        if(
            y>=0 &&
            tBoard[y][x]
        ){
            return false;
        }
    }

    return true;
}


function moveTetris(dx,dy){

    if(!tRunning)return;

    if(canMove(dx,dy)){

        tPiece.x+=dx;
        tPiece.y+=dy;

        renderTetris();

        return true;
    }

    return false;
}


function rotateTetris(){

    if(!tRunning)return;

    const rotated=
        rotatedCells(tPiece);

    if(canMove(0,0,rotated)){

        tPiece.cells=rotated;

    }else if(
        canMove(-1,0,rotated)
    ){

        tPiece.x--;
        tPiece.cells=rotated;

    }else if(
        canMove(1,0,rotated)
    ){

        tPiece.x++;
        tPiece.cells=rotated;
    }

    renderTetris();
}


function hardDrop(){

    if(!tRunning)return;

    let distance=0;

    while(canMove(0,1)){

        tPiece.y++;

        distance++;
    }

    tScore+=distance*2;

    lockPiece();
}


function lockPiece(){

    for(const [px,py] of tPiece.cells){

        const x=tPiece.x+px;
        const y=tPiece.y+py;

        if(
            y>=0 &&
            y<TH &&
            x>=0 &&
            x<TW
        ){

            tBoard[y][x]=tPiece.emoji;
        }
    }

    clearLines();

    tPiece=randomPiece();

    if(!canMove(0,0)){

        endTetris();

        return;
    }

    renderTetris();
}


function clearLines(){

    const remaining=
        tBoard.filter(
            row=>row.some(
                cell=>!cell
            )
        );

    const cleared=
        TH-remaining.length;

    if(cleared>0){

        for(
            let i=0;
            i<cleared;
            i++
        ){

            remaining.unshift(
                Array(TW).fill(null)
            );
        }

        tBoard=remaining;

        const points=[
            0,
            100,
            300,
            600,
            1000
        ];

        tScore+=
            points[
                Math.min(cleared,4)
            ];
    }

    setTopScore(tScore);
}


function renderTetris(){

    const board=
        document.getElementById(
            "tetrisBoard"
        );

    board.innerHTML="";

    for(let y=0;y<TH;y++){

        for(let x=0;x<TW;x++){

            const cell=
                document.createElement("div");

            cell.className="tcell";

            if(tBoard[y][x]){

                cell.textContent=
                    tBoard[y][x];

            }else{

                const stars=[
                    "",
                    "",
                    "",
                    "✨",
                    "",
                    "",
                    "·"
                ];

                cell.textContent=
                    stars[
                        Math.floor(
                            Math.random()*
                            stars.length
                        )
                    ];
            }

            board.appendChild(cell);
        }
    }


    if(tPiece){

        for(
            const [px,py]
            of tPiece.cells
        ){

            const x=
                tPiece.x+px;

            const y=
                tPiece.y+py;

            if(
                x>=0 &&
                x<TW &&
                y>=0 &&
                y<TH
            ){

                const index=
                    y*TW+x;

                const cell=
                    board.children[index];

                cell.textContent=
                    tPiece.emoji;

                cell.style.transform=
                    "scale(1.05)";
            }
        }
    }

    document.getElementById(
        "tetrisScore"
    ).textContent="🏆 "+tScore;
}


function tetrisStep(){

    if(!tRunning)return;

    if(!moveTetris(0,1)){

        lockPiece();
    }
}


function endTetris(){

    tRunning=false;

    clearInterval(tTimer);

    gameOver(
        "💥 ТЕТРИС ОКОНЧЕН",
        tScore
    );
}


function stopTetris(){

    tRunning=false;

    clearInterval(tTimer);

    tTimer=null;
}


function tetrisSwipe(direction){

    if(!tRunning)return;

    if(direction==="left"){

        moveTetris(-1,0);

    }else if(direction==="right"){

        moveTetris(1,0);

    }else if(direction==="down"){

        moveTetris(0,1);

    }else if(direction==="up"){

        hardDrop();

    }else if(direction==="tap"){

        rotateTetris();
    }
}


setupSwipe(
    document.getElementById("tetrisGame"),
    tetrisSwipe
);


/* =====================================================
   ОСТАНОВКА
===================================================== */

function closeGameLoops(){

    stopSnake();
    stopTetris();
}


/* =====================================================
   КЛАВИАТУРА ПК
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(currentGame==="snake"){

            if(e.key==="ArrowUp")
                snakeSwipe("up");

            if(e.key==="ArrowDown")
                snakeSwipe("down");

            if(e.key==="ArrowLeft")
                snakeSwipe("left");

            if(e.key==="ArrowRight")
                snakeSwipe("right");
        }


        if(currentGame==="tetris"){

            if(e.key==="ArrowLeft")
                moveTetris(-1,0);

            if(e.key==="ArrowRight")
                moveTetris(1,0);

            if(e.key==="ArrowDown")
                moveTetris(0,1);

            if(e.key==="ArrowUp")
                rotateTetris();

            if(e.key===" ")
                hardDrop();
        }

    }
);

</script>

</body>
</html>
